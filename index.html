<script id="ltc-data" type="application/json">{"primary":{"version":"V1.1.1 · A结构／司库定义已确认 · 2026-11-08","positioning":"A按材料顺序形成可选择的成果，选定并取得适用授权后交B执行；C接收A成果和B实绩，持续回流下一轮分析。LTC作为分析与执行的治理依据。","stages":[{"id":"S1","name":"线索管理","company":"机会识别","formPhase":"线索登记；方案阶段前端","goal":"把消息变成可追踪线索，先确认客户、场景和公司介入价值。","owner":"综合部归口登记；市场小组跟踪","inputs":["客户自荐、自主开拓、集团转介、关系引荐、合作事业部等来源信息","区县、客户类型、项目诉求、预计投资及公司介入环节"],"actions":["线索发现人填报附件1；综合部生成不可变XS编号","市场部提出项目建议书思路，记录关键决策人与认可方式","识别四朵云和场景入口，核对是否符合公司正面清单","双周复盘线索质量与转化，写本步完成情况和下一步计划"],"outputs":["XS线索记录及版本","客户主要负责人认可证据或继续跟踪/归档结论"],"gate":"质量控制：客户主要负责人认可思路，才完成机会识别；不等于立项获批。","risk":"未核实关系线索、代替客户认可、越权许诺资金或政府决策。","data":"LeadCreated / CustomerAcknowledged；建议去重，不改变XS原号。","sourceRefs":["主指引 第24条，第26–27页","附件1 第1–2页"]},{"id":"S2","name":"商机确认","company":"机会识别 → 立项决策","formPhase":"方案阶段","goal":"证明客户愿意深化、项目有收益路径、公司能够承接。","owner":"项目经理牵头；市场小组审核；综合部专业评审","inputs":["XS、深化项目建议书或战略合作协议","五维初步论证、预计收入成本、IRR、融资意向和风险清单"],"actions":["客户认可深化建议书或签订战略协议后，填附件2申报立项","按C/F、SPV、股权、特许经营、跨区域资源统筹及“三重一大”等特征判公司级","政策合规、资源可及、技术可行、经济合理、风险可控逐项论证","核对公司最低收益阈值；实际数值未随材料提供，不默认填值","任一专业评审不通过不得提交决策，有条件通过要写落实条件"],"outputs":["LX立项记录、项目负责人任命及审批条件","建立关联XS/LX的SJ商机记录（系统建立时点建议，待审）"],"gate":"D1立项：按有效分级授权决定正式投入；客户同意与公司内部审批分别留痕。","risk":"小金额绕过C/F强制公司级、把战略协议当已生效收费合同。","data":"ProjectClassified / InitiationApproved；阈值与授权版本同时快照。","sourceRefs":["主指引 第22–24条，第24–27页","附件2 第1–2页"]},{"id":"S3","name":"商机策划","company":"方案组盘","formPhase":"方案阶段","goal":"把需求、资源、资金、参与者和收益组织成可实现的交易结构。","owner":"项目经理牵头；创新研发中心方案与融资设计","inputs":["已批准LX与投入边界","客户决策链、生态伙伴意向及资源条件"],"actions":["采用高立模拆解，至少选择3个空间维度并完成过去/现在/未来对照","明确我方组盘方、交易结构设计者、项目管理者三重责任","引入资金方、产品技术方、市场开拓方；需要时启动附件5准入","设计SPV股权、实缴、治理、利益分配与退出路径","拆分客户项目总投资与公司合同额、公司收益，防止混账"],"outputs":["商业路径与产业方案、资本金与融资组合","合作结构草案、资源承诺证据、风险分担和退出方案"],"gate":"专业评审：资源与现金流形成证据闭环后继续深化，不凭融资意向认定资金落实。","risk":"政府隐性债务、集团信用背书、明股实债、无资源纯居间、投资兜底。","data":"PartnerLinked / StructureVersioned；每项资源记录承诺主体、条件、失效日期。","sourceRefs":["主指引 第6、8、12、25条","高立模V2.2 第3、9–10页"]},{"id":"S4","name":"方案设计","company":"方案组盘","formPhase":"方案阶段","goal":"让技术方案、财务模型、合同边界、运营需求彼此对应。","owner":"创新研发中心主编；项目经理组织会审","inputs":["组盘草案、现场与产业资料、资金条件","方案成果要求和客户认可记录"],"actions":["按客户决策进程形成项目立项报告、深化建议书或预可研","技术与产品方案包含交付、验收、运维及数据权属边界","形成资本金/债务/政策资金安排和压力情景，标明待批条件","按三十二、三十三条锁定咨询费计取与直接支付/业务冲抵/运营权益回收机制","融资工具逐项落实适用性、主管审批、资金方条件，不把工具名写成可融资结论"],"outputs":["可投标签约的方案与测算版本","技术与方案专业评审意见；资金闭环、回收和风险安排"],"gate":"质量控制：方案评审通过；报价与现金流有据、收益阈值待公司确定。","risk":"无运营方先建项目、未批准资金当确定收入、数据入表当现金。","data":"SolutionReviewed / FinancialModelFrozen；测算假设与证据逐项关联。","sourceRefs":["主指引 第11–15、25、29、32–34条"]},{"id":"S5","name":"合同管理","company":"投标签约","formPhase":"方案阶段 → 实施阶段","goal":"经审核、经授权，把商业方案转为可履行的合同义务。","owner":"项目经理第一责任；市场部组织；综合部会审","inputs":["招标文件、合格投标主体、报价及现金流测算","合同及附件、投标承诺一致性对照"],"actions":["投标前完成商务财务、法务合规、风险审核，再作D2投标决策","公司作为组盘方统筹，明确实际投标/签约/履约主体及资格","中标后检查合同与投标文件和中标承诺是否一致","实质性条款变更重新审核决策；D3签约前财务、法务合规、风险刚性前置","签约与授权用印分开留痕；附件3方案段由项目经理签署、决委会确认阶段转换"],"outputs":["投标决策、签约决策、正式合同及完整附件","交付接收包：范围、付款、验收、风险、变更与退出要求"],"gate":"D2投标 + D3签约；未审核不得投标，未决策不得签约。阶段确认权限差异列入待审事项。","risk":"先投后审、先干后补、联合体连带责任误读、合同漏附补充协议。","data":"BidApproved / ContractExecuted；合同原文、附件、审批版本哈希绑定。","sourceRefs":["主指引 第26、29条，第27–31页","附件3 第1–2、7页"]},{"id":"S6","name":"项目交付","company":"交付回款","formPhase":"实施阶段","goal":"按合同组织实施和书面验收，过程回款与变更控制同步进行。","owner":"项目经理；实际履约主体及交付负责人","inputs":["生效合同与交接签收","资源计划、里程碑、采购分包、验收和开票节点"],"actions":["召开合同交接会，技术/商务/风险责任人分别签收","按货物、咨询、软件、工程类型配置验收证据；C/F参照执行","工程核验报建、资质、安全、工资支付、过程/竣工档案及运营前置需求","采购与分包资格审查，专项咨询仅在上游正式咨询合同生效后启动招标","范围、价款、工期重大变更先D4审批再实施，更新预算与付款计划","验收、开票、催收滚动推进；交付完成不等于财务结清"],"outputs":["交付清单、过程验收/终验、变更协议、结算和回款凭证","运营移交包或适用项目的结项申请"],"gate":"验收控制 + 阶段确认：缺陷整改闭环；不得因未开通运营而虚造运营阶段。","risk":"未批变更先施工、验收证据缺失、应付先付现金未收、总包挪款。","data":"MilestoneAccepted / ChangeApproved / InvoiceIssued / ReceiptMatched；均关联合同版本。","sourceRefs":["主指引 第13、27–29、34条","附件3 第3–4页"]},{"id":"S7","name":"运营回款","company":"交付回款","formPhase":"运营阶段","goal":"把建成交付转为可核算运营与现金回收，并识别后续机会。","owner":"市场部回款；运营主体履约；综合部财务核对","inputs":["已参与C/F/EPC等前序环节的证据","运营协议、SLA、收益分配、数据授权和交接文件"],"actions":["检查O承接前提，不单独承接O或单纯O+AI","履行运营与运维，回访客户并记录续约/二次开发/新增场景","监管账户收入按运营成本、税金、公积金、优先债务本息、优先分红、剩余按股比分配","直接咨询费优先催收；业务冲抵和权益收益冲抵分别建台账，禁止虚报现金","合规采集、数据权属与使用范围先书面约定，确权/入表/融资各有独立证据","新机会回到S1，原项目义务和欠款继续独立跟踪"],"outputs":["运营与分润结算、收入成本、应收和已收对账","数据目录、授权证据、后续XS与移交退出计划"],"gate":"结项前核对剩余义务、质保、应收和争议；长期运营合同不得为流程好看提前关闭。","risk":"运营收益不足、对冲超限、把入表估值当收入或回款、超范围采数。","data":"OperatingSettlementApproved / ReceiptAllocated / RenewalLeadCreated；不同收益权不重复确认。","sourceRefs":["主指引 第14–15、27、30–34条","附件3 第5页"]},{"id":"S8","name":"移交退出","company":"变更关闭","formPhase":"结项审计阶段／已终止","goal":"有批准地关闭合同、清理资金与权限，并留下可复用证据。","owner":"项目经理终签；综合部审计与归档；有效授权决策主体","inputs":["交付完成、回款结清或依约终止依据","财务确认数据、后评价、合同关闭确认与档案目录"],"actions":["逐项核对收入、成本、毛利、净利润、回款率与立项测算偏差","未清应收、质保、争议、数据权益列剩余责任清单，不能以删除记录消除责任","D5关闭决策与附件3结项审计终签；未取得决委会结项决策不得正式结项归档","伙伴退出按预警→评估→限期整改→终止清算，遗留项目交接","按约返还/删除数据与回收账号授权，保留依法依规需保存的审计证据","区分线索归档、过程证据归档、项目结项归档三个状态"],"outputs":["合同关闭决策、后评价、财务终结与归档编号","经验资产、客户关系、数据权利清单和新机会"],"gate":"D5关闭：未决策不得关闭；条件结项必须列明保留义务与监督责任。","risk":"有债权未清却销号、过程归档误标结项、退出后残留品牌和数据权限。","data":"ContractClosed / AccessRevoked / ArchiveSealed；仅追加更正，保留历史版本。","sourceRefs":["主指引 第28–29、39–43条","附件3 第6–7页"]}],"decisions":[{"id":"C01","title":"阶段口径统一","issue":"公司五阶段、LTC八阶段、附件3四段填报并存；S5合同段实际包含投标和签约两个决策。","resolution":"公司阶段作管理主干，八阶段作任务视图，四段作填报分组；重大变更横跨全程。该映射为本次整合设计。","owner":"综合部／流程负责人／决策委员会","sourceRefs":["主指引 第21、29条","附件3 第1–7页","核心包 专家矩阵库"]},{"id":"C02","title":"金额分级未正式固化","issue":"主指引和附件2列100万元合同额、3000万元项目规模，明确是建议值；知识库和理论库另有不同分级。","resolution":"C/F、SPV、股权、特许经营、跨区域及“三重一大”等强制公司级先执行；金额只作建议规则展示，待审批阈值和授权表。不可将金额建议固化为已生效权限。","owner":"综合部／决策委员会","sourceRefs":["主指引 第22条，第25页","附件2 第2页"]},{"id":"C03","title":"阶段确认与分级授权张力","issue":"主指引允许市场小组级按授权审批；附件3要求每阶段均由决委会确认，附件2签署布局也统一列决委会。","resolution":"未获解释前不得自行下放附件要求的阶段确认；由综合部按第42条组织财务、法务、风险、合规审查并提决委会统一。","owner":"综合部／决策委员会","sourceRefs":["主指引 第22、42条","附件2 第2页","附件3 第7页"]},{"id":"C04","title":"公司最低收益阈值缺失","issue":"要求IRR不低于公司最低阈值，但材料未提供数值；主文禁止低于，附件2允许专项说明报决委会。","resolution":"不得自动推断阈值或自动放行低收益项目；取得有效阈值与例外授权规则后配置。","owner":"财务／风险／决策委员会","sourceRefs":["主指引 第24条，第27页","附件2 第2页说明4"]},{"id":"C05","title":"咨询费边界与比例方式","issue":"1亿元以下按3%，到1亿元起280万元，存在边界下降；3亿元以上360万元或如1.2%的比例方式关系未完全明确。","resolution":"保留原文展示与边界提示；不擅自平滑收费，不把1.2%设成固定强制比例。低于底线报决委会，报价口径由综合部解释。","owner":"财务／综合部／决策委员会","sourceRefs":["主指引 第32条，第31–32页"]},{"id":"C06","title":"EPC责任边界需法务澄清","issue":"第7条概括不承担连带责任，第13条又涉及联合体责任范围、公司作为成员参与。","resolution":"保留组盘、实际投标、签约、履约主体四种身份；逐合同审查责任，不能用内部指引免除法定或已约定责任。","owner":"法务／风险","sourceRefs":["主指引 第7条，第6页","主指引 第13条，第15–17页"]},{"id":"C07","title":"先执行后补审批不可采纳","issue":"深化体系知识库的紧急项目建议与公司第29条冲突。","resolution":"采用未审核、未决策不得流转；紧急事项仅缩短协调排期，不跳过前置程序。","owner":"流程负责人／综合部","sourceRefs":["主指引 第29条，第29–31页","核心包 深化体系知识库"]},{"id":"C08","title":"高立模完整性与质检范围","issue":"V2.2第5–8页若干模型章节仅有标题或重复迭代计划；第9页要求九维充分，第10页原则空间至少3维。","resolution":"建立九维检查表、至少3维深入分析并说明其余适用性；分析深度和内部认知方法对外展示范围由项目负责人审阅。未提供的模型细则不补造。","owner":"创新研发中心／方法论负责人","sourceRefs":["高立模V2.2 第3–10页"]},{"id":"C09","title":"示范文本与企业制度缺件","issue":"主文列附件4、6、7，但本轮未提供；另缺授权表、收益阈值、成本分摊细则、实际系统清单和发布审批证据。","resolution":"本次补充模板是建议字段，不冒充原合同或原表；正式使用前补齐并校准。","owner":"综合部／财务／信息化负责人","sourceRefs":["主指引 第34、41–44条，第33–34、40–41页"]},{"id":"C10","title":"案例与模型指标不能作公司事实","issue":"汝州案例在不同库中年限、收益口径和进度冲突；红场为有限信息推演；高立模自述评分无底稿。","resolution":"仅展示方法和差异，不导入本公司合同、预算或业绩；不把参考KPI阈值、奖金公式当有效制度。","owner":"知识库负责人／审计","sourceRefs":["核心包 行业专家弹药库／汝州案例／红场案例","高立模V2.2 第11页"]},{"id":"C11","title":"伙伴涉诉异常与准入条件","issue":"第37条要求无失信与涉诉；附件5说明又允许任一事项异常列为有条件通过或不通过。","resolution":"不得把“有条件通过”解释为可豁免禁止情形。一般异常与禁止情形的边界由综合部审查并提决策主体裁定。","owner":"综合部／风险／决策委员会","sourceRefs":["主指引 第37条，第37页","附件5 第4页"]},{"id":"C12","title":"过程资金支持的跨年口径","issue":"原则≤6个月且不得超过当年会计年度末；特殊≤12个月且不得超过一个完整会计年度，起算和跨年口径未明确。","resolution":"逐项目审批资金主体、用途、期限和回收保障；不得把最长12个月直接解释为跨年度自动授权。","owner":"财务／综合部／决策委员会","sourceRefs":["主指引 第38条，第39页"]}],"raciRoles":["项目经理","市场部／小组","创新研发","综合部专员","决策主体","履约／运营方"],"raci":[{"task":"线索登记、编号与过程档案","cells":["C","R","I","A","I","I"]},{"task":"需求澄清与客户认可证据","cells":["A","R","C","C","I","C"]},{"task":"技术、融资与组盘方案编制","cells":["A","C","R","C","I","C"]},{"task":"专业审查意见完整与真实","cells":["C","C","C","A/R","I","C"]},{"task":"立项／投标／签约／变更／关闭决策","cells":["R","C","C","C","A","I"]},{"task":"合同交接、实施与验收组织","cells":["A","C","C","C","I","R"]},{"task":"开票、收入成本与收款核销","cells":["C","R","I","A/R","I","C"]},{"task":"运营SLA、数据授权与分润对账","cells":["A","C","C","C","I","R"]},{"task":"合同后评价与结项材料","cells":["A/R","C","C","R","I","C"]},{"task":"伙伴准入或退出决策","cells":["R","R","C","C","A","I"]}],"abc":{"status":"按用户本轮明确的输入顺序整理；A优先细化，B/C先定义接口","bEntry":"选定成果并完成适用授权后，才进入B执行","treasuryMeaning":"用户已确认：司库指资金与财务司库分析。基于同一项目输入版本，核对资金来源与用途、可支用条件、收付计划、现金流缺口、偿债安排和资金风险；当前是分析职责设计，尚未接入真实账户或司库系统。","resultSources":["A","B"],"foundation":["常备规则底座：公司指引、适用授权、原表与合同规范。用于约束本次分析，不替代项目实际资料。","常备知识底座：专家库、LTC知识、高立模方法、获准使用的行业与财务知识。按版本和权限维护，无需每个项目重复混装。","项目输入按A1→A2→A3顺序整理。A4各模块在同一个输入版本上分析；A5生成不同用途成果。","新事实可以补充前序材料：标出变更依据、重新核对参数和纪要、生成新版本，再更新下游分析；不静默覆盖旧版。"],"steps":[{"id":"A1","title":"项目参数","purpose":"先建立这个项目的事实与约束底稿，让后面的纪要、思路和分析有共同坐标。","inputs":["项目名称、编号、区县、客户／项目主体及各方角色","业务场景、公司拟介入环节、项目规模与公司合同额（分别记录）","资源条件、资金来源、现状进度、目标、期限及约束","原始证明文件、数据日期和信息提供人"],"actions":["沿用原表中的项目基础字段，识别缺失、冲突和过时信息","逐项标记已核事实、待核数据、估算假设，未知值保留未知","形成参数版本和待补清单；不同项目资料分别归属"],"outputs":["项目参数表V1及来源索引","待核／待补清单"],"criteria":["项目主体、问题范围和目标可识别","关键参数有来源或明确标待核","建立参数只形成分析输入，不自动完成公司登记或立项审批"],"sourceRefs":["用户本轮明确顺序：1 项目参数","附件1 第1–2页","附件2 第1–2页"]},{"id":"A2","title":"会议纪要","purpose":"在参数底稿上补充沟通过程，分清谁说了什么、哪些已决定、哪些仍有分歧。","inputs":["A1项目参数有效版本","会议记录、录音转写或原始纪要；会议时间、参与角色与资料版本"],"actions":["区分事实陈述、参与方意见、已作决议、待确认事项和行动项","记录责任人、时限、认可／承诺的具体范围与证据","模型整理稿标待确认；会议讨论不自动成为客户承诺或公司授权","纪要出现参数变化时，提出变更并回到A1核对，保留新旧版本关系"],"outputs":["经核对的会议纪要及决议／行动项清单","参数变更建议、分歧与待确认清单"],"criteria":["会议来源和时点可追溯","意见、决议、承诺与行动已分开","未确认纪要可用于探索分析，不能充当已批准执行依据"],"sourceRefs":["用户本轮明确顺序：2 会议纪要","附件3 第4页本阶段附件"]},{"id":"A3","title":"核心思路","purpose":"基于项目事实和会议沟通，形成这次要研究的主张、路径与关键问题。","inputs":["A1参数版本＋A2纪要版本","用户／项目负责人提出的核心判断、目标路径与已认可方向"],"actions":["说清服务谁、解决什么问题、靠什么资源和路径实现价值","列明我方角色、各方诉求、收入回收思路、关键假设和主要风险","把用户已确认思路、模型补充建议、尚待验证假设分别标识","形成共同输入包：参数＋纪要＋核心思路＋附件目录＋本次分析问题"],"outputs":["核心思路说明及候选路径","A输入包版本，供所有分析模块共同使用"],"criteria":["思路能追溯到事实、沟通或明确假设","分析问题与本次范围已写清","核心思路形成不等于客户认可、立项或执行获批"],"sourceRefs":["用户本轮明确顺序：3 核心思路","主指引 第24–25条，第26–27页"]},{"id":"A4","title":"专家与多视角分析","purpose":"在同一输入包上组织专业分析，再汇总证据、共识、分歧与待决策事项。","inputs":["A3形成的同一版本输入包","专家库知识、可追溯真实专家建议及适用边界","获准使用的大模型、高立模、司库、LTC模块"],"actions":["先按问题和权限选择需要的分析模块，不要求每项任务调用全部模型","专家与各模型可并行分析；每一路标明身份、输入版本、来源及局限","高立模检查空间／时间／深度逻辑，司库核对资金来源用途、收付计划、现金流缺口、偿债条件和资金风险，LTC检查阶段与治理闭环","汇总共同结论、主要分歧、证据缺口、风险、候选方案及需负责人裁决事项","收到新增事实时更新输入包并标明哪些分析需要重做，不能拼接不同版本意见"],"outputs":["多视角分析底稿与来源引用","统一综合分析、方案比较、分歧和待决策清单"],"criteria":["各路采用的输入版本一致或明确列出差异","真实专家意见与模型建议分别标识","不以多数模型同意替代事实核验或专业审批","未接入模块标未接入，不能模拟成真实参与结果"],"sourceRefs":["用户本轮明确顺序：4 专家库／大模型／高立模／司库／LTC分析","主指引 第8、29条","高立模V2.2 第3–4、9–10页"]},{"id":"A5","title":"分类成果","purpose":"把经过汇总的分析转成不同用途、不同读者的成果，供审阅、选择及后续交接。","inputs":["A4综合分析、方案候选与风险分歧","成果用途、读者、格式、保密范围和本次输出要求"],"actions":["按需要选择成果类型，同一项目可以形成多类成果和多种候选方案","不同版本共享同一事实底稿，允许叙述层次不同，不能相互改写数字或责任","每份成果注明项目、输入版本、方案、用途、状态、来源与未解决事项","将草稿、已审阅和被选定成果分别放入C；选定成果再形成B执行交接基线"],"outputs":["分类成果包：诊断、总体方案、资金、风控、沟通或执行交接","成果比较／选定记录、待决策项与B交接包"],"criteria":["成果用途、来源和版本清楚","候选方案与最终选定版本可区分","产生、下载或选定成果都不自动构成执行授权"],"sourceRefs":["用户本轮明确顺序：5 出几种类型成果，然后才是B"]}],"views":[{"id":"V1","title":"专家库与专家建议","inputs":["按问题检索的知识条目","真实专家意见原文、日期、专业背景及适用范围"],"outputs":["专业判断、依据和补充问题"],"control":"专家库知识引用、真实专家建议、模型模拟分析分别标识；没有真实意见时显示未取得。"},{"id":"V2","title":"各类大模型","inputs":["同一版本且按权限裁剪的输入包","各模型明确的分析任务与输出结构"],"outputs":["结构化分析、方案候选、反对意见与缺口"],"control":"模型数量按任务需要确定；不把模型意见当事实，不未经授权外传全部原始资料。当前是调用设计，不代表已实际调用。"},{"id":"V3","title":"高立模","inputs":["项目问题、事实与核心思路","空间九维检查、时间三段对照和内部深度分析方法"],"outputs":["系统性洞察、关键驱动因素、条件与行动建议"],"control":"按已有资料标明覆盖与缺口；内部认知底稿与对客成果分别管理。"},{"id":"V4","title":"资金与财务司库分析","inputs":["按公司、SPV、客户和伙伴区分的资金归属，币种、数据日期、含税口径及受限／可用余额；未知数据列待核。","资本金、债务与政策资金的来源、用途、金额和预计到位日；意向、申请、批复、可提款、到账状态分别记录。","合同及里程碑对应的咨询费、工程、设备和运营回款计划，开票、应收、到期及核销证据。","采购／分包、税费、工资、保证金、质保金、退款、收益分配与融资本息等支出和到期义务。","授信有效期、未提款余额、实缴／担保／抵押及提款条件、用途限制、审批与资金支持回收要求。","财务测算假设、基准与延迟情景、原始凭据和待落实条件；各类计划核对重复计入。"],"outputs":["按主体分列的资金来源—用途表及实际落实状态。","回款、付款与偿债计划，列明节点、责任人、前置条件和资金可用时点。","可支用资金及资金占用分析，区分账面余额、受限余额、授信和实际到账。","现金流滚动预测、峰值缺口和回款延迟／支出变化压力情景。","债务到期、流动性、回款和受限资金等风险清单及待决策措施。","需要财务确认的口径、待核数据与适用审批条件，汇入A5资金方案和B执行交接包。"],"control":"财务岗位核对口径、凭据与测算，法务／风险按职责审阅相关条件。授信、融资意向、预测收入和到账现金分别展示；跨主体资金不得直接混算。分析结果不自动形成融资、调拨、垫资、延期或付款授权，未接入真实账户时明确标为资料分析。"},{"id":"V5","title":"LTC","inputs":["项目阶段、方案及交易结构","公司规则、角色、表单、决策与回款要求"],"outputs":["阶段定位、流程缺口、决策条件、角色与证据闭环"],"control":"LTC是A4的分析视角，也是B的适用执行约束；不替换A1—A5材料与成果顺序。"}],"deliverables":[{"id":"O1","title":"项目诊断与决策摘要","purpose":"给项目负责人或决策层快速判断方向、价值、主要反对证据、最大未知与下一步验证。","outputs":["核心结论、证据、条件、风险与待决策清单"],"review":"负责人核对结论与事实；不凭摘要代替正式审批。"},{"id":"O2","title":"项目总体／组盘方案","purpose":"给业务统筹与合作各方理解资源、角色、交易结构和实施路径；可列不同候选方案。","outputs":["目标、业务模式、C/F/EPC/O/AI组合、资源、分工、收益与退出条件"],"review":"业务、方案与相关专业人员复核，同一事实跨版本一致。"},{"id":"O3","title":"融资与资金安排方案","purpose":"给财务、资金方及决策层检查资金来源、用途、回收和缺口，汇集A4资金与财务司库分析结论。","outputs":["分主体资金来源用途及实际落实状态","收付／回款／偿债计划、可用条件和资金占用","现金流情景、峰值缺口、资金风险与待落实条件"],"review":"财务、法务、风险审阅；测算、意向、审批和到账分别标记。"},{"id":"O4","title":"风险与治理评审材料","purpose":"给专业审查和决策人员核对条件、责任、风险、表单、决策与证据完整性。","outputs":["风险清单、评审意见、重大分歧、待补证据、决策提报材料"],"review":"各专业岗位分别出具意见，分析汇总不能代签。"},{"id":"O5","title":"分对象沟通与汇报成果","purpose":"按政府、客户、资金方、伙伴或内部汇报分别表达同一项目。","outputs":["汇报稿、提案、演示或交互页面；内容按用途和权限裁剪"],"review":"核对公开范围和表述权限；生成稿与已经对外发送分别记录。"},{"id":"O6","title":"B执行交接包","purpose":"把被选定并获适用授权的成果变成可执行基线。","outputs":["目标、范围、任务、负责人、资源预算、权限、依赖、交付物、验收标准、停止条件"],"review":"项目负责人确认交接；合同、付款、外发、系统写入及部署等动作各自核对授权。"}],"handoff":["选定哪份成果、哪种方案和哪个版本，未选定方案不混入执行基线。","执行目标、范围内／范围外、允许动作和待核限制。","任务拆分、负责人、协同方、输入、依赖、时间与里程碑。","经财务复核的资源预算、资金可用时点、收付及回收条件，账户／数据／系统权限与已有审批；未获授权不生成真实支付或融资动作。","交付物、验收人、验收标准、证据与停止／升级条件。","适用的立项、投标、签约、变更、关闭决策及专业审核继续生效。","建立执行基线ID并回写C，B执行中的重大变化回到A补充分析，再履行适用变更程序。"],"resultFields":["项目ID","结果来自A分析或B执行","A输入包版本","成果类型与候选方案","成果版本及前后关联","来源与证据","负责人及审阅记录","查看／外发权限","核对状态","成果状态","执行授权状态","执行／验收状态"],"resultStates":[{"title":"资料核对状态","scope":"已核、待核、冲突、过时"},{"title":"成果状态","scope":"草案、审阅中、已审阅、被选定、已被替代或作废；保留历史"},{"title":"执行授权状态","scope":"未授权、待审批、限定授权、授权终止；关联真实批准依据"},{"title":"执行与验收状态","scope":"未执行、执行中、已交付待验、验收通过、验收不通过；关联实际凭据"}]}},"governance":{"status":"原件已核对：制度事实、原表字段、解释冲突与建议补充分别标记","scopeNote":"已逐页读取《山高产融（山东）数字技术有限公司全链路一》41页和附件1、2、3、5四张原表。原文采用操作管理五阶段，附件3采用方案—实施—运营—结项审计四段滚动记录，另有附件1线索入口；两者映射而非互相替换。D1—D5为正文明确的五类决策；QC编号仅为本稿便于系统落地增加的检查标识，不是新增公司审批制度。职责分离、电子校验、系统权限和数据标识属于建议实现；具体组织岗位名称以原件为准。","roles":[{"id":"R01","title":"项目负责人（项目经理）","status":"原文角色","responsibility":"项目第一责任人，自机会识别至合同关闭全流程负责；牵头执行公司统筹的项目思路、拼盘、资金方与伙伴对接。负责投标组织、质量与阶段填报、移交及终签。","authority":"牵头执行与报批；重大事项按分级权限提报，不自行替代专业审查和决策委员会。","separation":"建议电子控制：发起、专业审核、决策不得共用身份；客户验收和实际到账由适格责任人分别核验。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p25—28，第23、26条","附件3p7"]},{"id":"R02","title":"市场部","status":"原文部门","responsibility":"负责客户关系、商机跟进、投标组织、合同签订与回款；提出项目建议书思路、获取客户主要负责人认可。","authority":"负责客户与商务推进；回款责任不等于财务到账或核销确认。","separation":"建议电子控制：不得仅凭客户口头付款承诺标记实际回款。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p26，第23、24条"]},{"id":"R03","title":"创新研发中心","status":"原文部门","responsibility":"负责方案策划、融资设计与技术支持；支持全链路方案和项目组盘。","authority":"参与技术方案、融资路径和技术经济测算。","separation":"原文边界：不承诺融资兜底、授信额度或政府决策结果。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p11、26—27，第11、23、25条"]},{"id":"R04","title":"综合部","status":"原文部门","responsibility":"负责销售管理、法务合规、财务、招采与合同管理；归口登记线索、统一编号及资料归档；负责指引解释。","authority":"组织各分管专员全程会审；重大解释分歧经财务、法务、风险、合规审查后提交决策委员会。","separation":"建议电子控制：登记与保管不自动取得业务审批权；系统管理员不替代综合部专业判断。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p26、40—41，第23、24、42条","附件1p2"]},{"id":"R05","title":"市场小组长 / 市场小组","status":"原文角色","responsibility":"小组级项目牵头与资源配置；在授权额度内审批、逐级上报；线索跟踪培育，双周复盘质量与转化率。","authority":"仅在有效授权范围内处理小组级项目五类决策。","separation":"原文授权与附件3逐阶段决委确认的关系待统一；本稿不放宽附件3确认要求。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p25—27，第22、24条","附件3p7"]},{"id":"R06","title":"公司决策委员会","status":"原文机构","responsibility":"审定公司级项目立项、投标、签约、变更、关闭；决定合作事业部准入、例外收费和特殊资金支持；依附件3逐阶段确认。","authority":"按制度和有效授权决策；附条件同意必须列明决策条件。","separation":"原文：专业评审不通过不得提交立项决策；任一决策未通过或未履行程序不得流转。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p25、30、32、37、39—41","附件2p2、附件3p7"]},{"id":"R07","title":"线索发现人 / 跟进负责人","status":"原文角色","responsibility":"线索发现人填附件1，跟进负责人动态更新工作计划、机会与风险。","authority":"提交线索事实及建议书思路；综合部统一编号。","separation":"建议电子控制：不得自行改已定XS编号、覆盖其他来源记录或以登记代替客户认可。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["附件1p1—2"]},{"id":"R08","title":"综合部政策合规分管专员","status":"原文专业分工","responsibility":"立项前评审政策契合、审批路径、合规边界；参与全流程合规会审。","authority":"独立出具专业意见；不通过不得提交决策，有条件通过列明落实条件。","separation":"建议电子控制：审核版本与流转版本绑定，条件落实保留凭据。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p26、30，第23、29条","附件2p2说明5"]},{"id":"R09","title":"综合部法务 / 风险分管专员","status":"原文专业分工","responsibility":"投标前审资格、废标及围串标、条款一致性；签约、变更前审核；全流程评估法律、信用、履约与数据风险。","authority":"出具法务与风险专业意见；签约前审核为刚性前置。","separation":"原文双审含财务、法务、合规、风险，不能只勾一项代替四类审查。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p28、30，第26、29条","附件2p2、附件3p2"]},{"id":"R10","title":"综合部财务 / 财务合规分管专员","status":"原文专业分工","responsibility":"审核成本收益、现金流、IRR、付款节点、保证金、资金及支付安排；财务确认结项收入、成本、毛利、回款数据。","authority":"独立出具财务与合规意见；按信息集团财务规定办理收入确认与成本归集。","separation":"建议执行分工：到账、开票、应收、核销、减免与付款审批分离；原件未列出具体会计岗位名。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p28、30、33—34","附件2p2、附件3p7"]},{"id":"R11","title":"综合部招采 / 合同分管专员","status":"原文专业分工","responsibility":"全程参与招采与合同会审；规范标书合同、采购分包及合同变更档案。","authority":"履行招采、合同管理职责；专项咨询须上游正式咨询合同生效后才启动招标。","separation":"原文：专项咨询以中标通知书、服务合同及履约成果列项目成本，不能用战略协议替代。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p26、34，第23、34条"]},{"id":"R12","title":"客户主要负责人 / 客户授权接口","status":"原文外部角色；具体授权核验为建议控制","responsibility":"客户主要负责人认可建议书思路即完成机会识别；深化建议书认可或战略合作协议构成立项申报前提。","authority":"客户侧审批、签约及验收依实际授权和合同程序。","separation":"原文公司不得替代政府、项目公司董事会决策；建议核实联系人是否具备相应签署权限。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p5—6、11、26，第6、7、11、24条","附件1p2"]},{"id":"R13","title":"生态伙伴 / 合作事业部","status":"原文外部角色","responsibility":"补强资金、产品技术、市场开拓三类能力；按协议承担本环节专业交付、获取收益、自担风险。","authority":"合同合作关系、平等自主，不构成公司隶属单位；品牌及区域授权仅限具体业务。","separation":"原文：公司仅对协议明确联合事项有限共担，不作无限兜底；未准入不得以合作事业部名义开展业务。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p35—40，第35—40条","附件5p4"]},{"id":"R14","title":"具资质投标主体 / 联合体牵头与成员","status":"原文外部角色","responsibility":"项目经理评估具资质伙伴担任投标主体；EPC依项目特点由设计或施工方牵头，公司作为成员参与。","authority":"按联合体协议落实工作、责任边界、收益与内部追偿。","separation":"待决策：正文p6“不承担任何连带责任”与p17“明确连带责任范围”存在口径张力，不能自行裁成无责任。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p6、16—17、27，第7、13、26条"]},{"id":"R15","title":"专业运营方 / 合作开发方","status":"原文外部角色","responsibility":"承接运营、运维和四朵云SaaS协作；按服务协议执行、沉淀运营侧数据，配合收益结算与后评价。","authority":"运营模式、收入来源与数据权属事先书面约定。","separation":"原文：必须已有C、F、EPC至少一项参与基础，不单独承接运营或单纯O+AI；数据用途不得越权。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["主文档p17—20、29，第14、15、27条"]},{"id":"R16","title":"综合部审计（评审）人","status":"原表角色","responsibility":"结项审计阶段作综合部终签，出具通过、有条件通过或不通过意见；核验结算、审计、后评价、关闭与归档资料。","authority":"形成专业终签，不替代决策委员会结项决策。","separation":"原表：未取得决策委员会结项决策不得归档。建议审计不直接修改被审业务事实。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["附件3p6—7"]},{"id":"R17","title":"数据 / 系统管理员","status":"建议新增实施角色","responsibility":"维护身份、权限、接口、备份、版本与审计日志；支持数据最小授权与故障修复。","authority":"仅凭经批准工单配置系统，不因此获得审批、验收或财务确认权。","separation":"建议实施：不得改写已签署事实、删除审计、代签审批或绕过专业否定意见。","handoff":"资料和结论均进入对应项目证据链；具体电子权限配置另经授权确认。","sourceRefs":["建议设计","依据主文档p20、40的数据与保密边界展开"]}],"gates":[{"id":"QC01","title":"线索登记与机会识别","stage":"线索入口 → 方案阶段","status":"原文要求；QC编号为建议设计","purpose":"核实客户认可与正面清单，形成可追溯线索。","inputs":["F01项目线索登记表","项目建议书思路、客户主要负责人认可情况","生态伙伴招募、商业路径、初步成本收益及风险"],"reviewers":["线索发现人填写","综合部登记编号","市场部 / 市场小组跟踪评估"],"criteria":["综合部统一编XS－8位日期－2位流水号且不得变更","客户主要负责人认可项目建议书思路才算机会识别","符合正面清单进入立项；不符合归档；双周例会复盘"],"pass":"进入D1前进一步深化建议书并取得认可，或签订战略合作协议。","return":"继续跟踪：写明本步完成情况和下一步计划。","reject":"不符合正面清单的归档处理。","a ,"重复归属处理为建议补充"]},{"id":"E02","title":"需求、预算或采购路径无法确认","status":"原文暂缓 / 终止机制；验证动作建议","trigger":"商机缺少关键事实，仅有口头意向或内部猜测。","control":"转培育 / 待验证状态；列出最关键验证动作、责任人和复核节点，限制不必要投入。","owner":"市场部 / 项目经理 + 市场小组负责人","recovery":"取得可核实的客户、资金或采购证据后重新资格评审。","gates":["QC01","D1"],"sourceRefs":["附件1p2","附件3p7"]},{"id":"E03","title":"经济性不足或资金缺口超承受范围","status":"原文风险与经济评审；情景操作建议","trigger":"复核发现成本漏项、回款延迟可能造成资金缺口，或触发正式制度底线。","control":"更新情景测算，提出缩范围、改付款条件、资源调整或终止方案；未授权不擅自垫资。","owner":"综合部财务专员 + 业务负责人 + 授权决策人","recovery":"批准后的经济性与资金安排可执行，相关风险条件已落实。","gates":["D1","D2","D3","QC03"],"sourceRefs":["主文档p27、30、33（第24、29、33条）"]},{"id":"E04","title":"超授权或发起人自批","status":"原文分级授权；身份互斥建议","trigger":"审批额度 / 事项超权限、审批者有利益关系、发起与最终审批为同一身份。","control":"阻断该审批结果并按正式授权链升级；保存原申请与冲突事实，不通过临时改角色绕过。","owner":"综合部销售管理 / 项目经理 + 风控 / 合规 + 授权管理负责人","recovery":"适格且无冲突的授权人完成复核，授权范围和有效期可核验。","gates":["QC01","D1","D2","D3","QC03","QC04","QC06","D5"],"sourceRefs":["主文档p25、30（第22、29条）"]},{"id":"E05","title":"投标失败、客户取消或报价过期","status":"建议细化分支","trigger":"失标、正式取消、报价未接受或有效期届满。","control":"记录丢单原因与成本；停止继续承诺，跟踪保证金退回及未完成保密 / 资料义务。","owner":"市场部 / 项目经理 + 商务 + 财务","recovery":"有新招采 / 客户重新确认时按新版本重审；失单历史保留。","gates":["D2","D3","D5"],"sourceRefs":["主文档p28（投标决策与保证金审核）","失标处置细节为建议"]},{"id":"E06","title":"重大条款偏离或对方拒绝缓释","status":"原文审核前置；不可豁免判断待适用法规","trigger":"出现不可承担的责任、付款、担保、知识产权或争议条款。","control":"法务 / 风控独立出具意见；区分可经授权接受与不可豁免事项，未决时暂停签署。","owner":"法务 + 风控 + 授权决策人","recovery":"对方接受修改，或可豁免事项获得适格批准并落实缓释；不可豁免事项不走一般例外放行。","gates":["D2","D3"],"sourceRefs":["主文档p28、30（第26、29条）"]},{"id":"E07","title":"签署版本不一致、授权不足或生效条件未成就","status":"原文文本一致与重审；授权核验建议","trigger":"最终合同与审批文本不同、签约人授权不明、条件未满足。","control":"标记待核 / 未生效，暂停不应开始的履约；逐项比对并补审，不伪造签署或补写生效日期。","owner":"合同管理 + 法务 + 业务负责人","recovery":"适格签署及最终版本核验完成，生效条件有证据。","gates":["D3","QC03"],"sourceRefs":["主文档p28（第26条）"]},{"id":"E08","title":"预付款未到、资源不足或环境不具备","status":"建议启动控制，依实际合同适用","trigger":"启动依赖未落实，客户要求先干后补，或关键供应延误。","control":"转待启动 / 部分受限；明确可授权的准备活动与停止边界，协调条件调整。","owner":"项目经理 + 商务 + 财务 / 采购","recovery":"合同启动条件与资源落实；若调整启动前提，先完成有效变更与授权。","gates":["QC03"],"sourceRefs":["主文档p28、34（第27、34条）"]},{"id":"E09","title":"未审批范围蔓延或口头变更","status":"原文硬控制：变更前报批、未报批不得结算","trigger":"客户或内部提出新增功能、改工期、改材料，缺乏有效确认。","control":"原文：合同范围、价款、工期重大变更先履行变更决策、签变更协议、综合部法务合规审核；实施阶段上下游变更分别报批，未报批不得结算。建议实施：同步评估收入成本、工期、现金与风险并更新版本，不增设常规“紧急先干后批”通道。","owner":"项目经理 + 商务 + 相关专业负责人","recovery":"内部审批和合同要求的客户确认均完成，基线及下游计划同步。","gates":["D2","D3","QC03","QC04","QC06"],"sourceRefs":["主文档p17、29—30","附件3p3、p7"]},{"id":"E10","title":"交付延期、质量不合格或客户拒收","status":"原文风险争议台账、暂缓 / 终止；整改流程建议","trigger":"里程碑延期、关键缺陷、验收未通过或客户拒收。","control":"保留失败证据，出整改与复验计划，评估违约及索赔；验收、付款触发和项目状态据实更新。","owner":"项目经理 + 质量 / 技术 + 商务 + 法务","recovery":"整改复测及适格客户确认完成；争议解决方案依法依约经批准。","gates":["QC03","QC04","QC06","D5"],"sourceRefs":["主文档p29（第27、28条）","附件3p3—4、p7"]},{"id":"E11","title":"合作伙伴能力不足、违约或替换","status":"原文退出机制；替换连续性为建议","trigger":"伙伴未交付、资质变化、无法满足质量 / 时限或被暂停合作。","control":"限制新增任务与非必要访问，保全已交付成果和客户服务连续性；评估替换成本与追偿。","owner":"综合部招采与合作对接负责人 + 项目经理 + 法务 / 风控","recovery":"补救获验收或新伙伴完成准入、合同与移交；未结争议和义务持续跟踪。","gates":["D1","D3","QC03","QC04","QC06","D5"],"sourceRefs":["主文档p40（第39条）","附件5p4"]},{"id":"E12","title":"合作权益、贡献或结算争议","status":"原文事先约定三维贡献与分配；争议冻结建议","trigger":"多方主张同一贡献、分配依据不清或对账不一致。","control":"区分客户合同、内部协作、渠道费用及交付成本；冻结有争议部分并保留无争议部分的依约处理。","owner":"合作管理 + 财务 + 法务 + 授权决策人","recovery":"依据有效协议和可验证贡献形成对账与适格批准，不用事后口头比例补账。","gates":["D1","D3","QC06","D5"],"sourceRefs":["主文档p36、40（第36、38条）","附件5p2"]},{"id":"E13","title":"客户逾期、部分付款或拒付","status":"原文付款风险与催收；催收分层建议","trigger":"付款到期未到账、到账不足或客户提出抵扣 / 拒付。","control":"按应收明细对账并分层催收；核实付款条件及争议，评估继续履约、暂停或法律措施，按合同与正式制度授权。","owner":"市场部 / 项目经理 + 应收会计 + 财务 + 法务","recovery":"款项到账并完成匹配，或经批准的重组 / 扣款 / 争议方案生效；未收部分保留应收状态。","gates":["QC06","D5"],"sourceRefs":["主文档p29、32—33（第27、28、33条）","附件3p4"]},{"id":"E14","title":"第三方付款、合并付款或不明款","status":"建议财务匹配控制","trigger":"付款主体与合同主体不一致，或一个到账对应多合同 / 多项目。","control":"登记待核款；获取付款用途及关联依据，审核后逐行分摊；不得简单按金额相近匹配。","owner":"出纳 + 应收会计 + 财务复核；必要时法务 / 风控","recovery":"真实银行到账、付款关系和分摊依据经复核一致，余额仍明确可追溯。","gates":["QC06"],"sourceRefs":["主文档p29、33（收款及财务口径）","原件未规定第三方款电子匹配"]},{"id":"E15","title":"账户变更、重复核销、银行冲正或退款","status":"建议财务与系统控制","trigger":"对方通知改账户、同一流水重复使用、到账撤回或客户要求退款。","control":"通过独立渠道核验账户；流水唯一防重；退款独立审批并核对原交易，冲回用反向记录关联原凭据。","owner":"资金 / 出纳 + 财务复核 + 业务；异常升级风控","recovery":"账户与原交易核实、适格授权和账务同步完成；应收重开或余额调整有依据。","gates":["D3","QC06","D5"],"sourceRefs":["主文档p29、33","原件未规定流水幂等或账户独立核验实现"]},{"id":"E16","title":"开票、验收、收入或应收口径混淆","status":"原文收入口径及上下游分别列示；电子核对建议","trigger":"有人以开票代替履约、以验收代替收款，或以预测回款代替实际到账。","control":"分开记录合同事件、履约证据、发票、会计确认、应收与银行资金，核对一对多关系；会计处理依据正式政策。","owner":"财务负责人 + 应收 / 开票会计 + 项目经理","recovery":"各类事实与会计口径对账清楚，错误按授权更正并保留轨迹。","gates":["QC04","QC06","D5"],"sourceRefs":["主文档p33—34（第34条）","附件3p4、p6—7"]},{"id":"E17","title":"AI 摘要错误、低置信或证据冲突","status":"建议智能体人工复核控制","trigger":"智能体输出缺来源、与原件不同、提取金额或条款不一致。","control":"降级为待人工确认，展示原文定位及版本；禁止自动改合同、批准闸口、确认验收或核销，错误进入纠正记录。","owner":"对应业务数据负责人 + 智能体产品 / 系统负责人","recovery":"适格人员核对原件并纠正，受影响下游结果完成复核。","gates":["QC01","D1","D2","D3","QC03","QC04","QC06","D5"],"sourceRefs":["主文档p20（模型训练数据合规）","具体智能体执行仍须核心包核对"]},{"id":"E18","title":"系统接口失败、重复事件或账实不同步","status":"建议系统集成控制","trigger":"CRM、审批、合同、项目或财务系统同步失败，消息重复或乱序。","control":"显示待同步状态，保留唯一事件号和重试记录；关键闸口以权威系统及证据为准，防止重试生成重复合同、票据或核销。","owner":"系统集成负责人 + 各系统业务数据负责人","recovery":"幂等重放与对账通过，差异处理有责任人；不以接口返回成功替代业务落账核验。","gates":["D1","D3","QC03","QC04","QC06","D5"],"sourceRefs":["建议设计","原件未指定系统接口或幂等机制"]},{"id":"E19","title":"合作数据越权、泄露或用户离岗","status":"原文保密数据边界；具体权限控制建议","trigger":"伙伴或离岗人员仍可访问不相关客户、合同、成本或财务数据。","control":"按项目与角色最小授权，撤销异常访问并保全日志；核查披露范围与必要通知，按适用制度处理。","owner":"数据负责人 + 系统管理员 + 风控 / 合规","recovery":"权限整改及访问复核完成，受影响数据和义务有处理记录。","gates":["QC01","D1","D3","QC03","D5"],"sourceRefs":["主文档p20、40（第15、40条）"]},{"id":"E20","title":"暂停、终止、结案后索赔或质保重开","status":"原文退出关闭；结案重开机制建议","trigger":"项目暂停 / 解约，或关闭后出现缺陷、索赔、未返保证金及新账务差异。","control":"分清暂停履约、合同终止与管理结案；清点资产、资料、收付、未决义务和访问；重开生成新事件不覆盖原结案。","owner":"项目经理 / 服务负责人 + 商务 + 财务 + 法务","recovery":"复工条件重新满足，或终止方案及持续义务完成移交；财务结清须另行核验。","gates":["D3","QC03","QC04","QC06","D5"],"sourceRefs":["主文档p29、40（第28、39、40条）","附件3p7"]}],"partners":[{"id":"P01","title":"三类伙伴与合作事业部性质","status":"原文规则","objective":"以我为主、生态协同；合作关系平等，风险分层。","actions":["三类伙伴：资金方、产品技术方、市场开拓方，至少补强一类真实能力。","合作事业部为外部延伸与战略协同单元，可为专业公司或具能力个人，与公司是合同合作、平等、自主关系，不构成隶属。","公司主导全链路方案和项目管理；伙伴按环节专业交付、自担风险；对协议明确联合事项有限共担，不作无限兜底。"],"evidence":["附件5基本信息、申请类别、伙伴类别与能力资源"],"owner":"公司对接负责人、市场小组、综合部","gates":["D1","D3"],"sourceRefs":["主文档p35—36，第35、36条","附件5p1—2"]},{"id":"P02","title":"准入与试点验证","status":"原文规则","objective":"先验证能力，再履行完整准入，未审批不授品牌。","actions":["试点项目前期合作验证为先导，开展尽调合规审查、决委决策、签合作协议。","资信良好、无失信与涉诉，认同合规，具清晰技术产品矩阵及山东或指定市场判断；禁止无真实能力、纯居间套利、利益输送、围串标、贿赂等。","尽调逐项覆盖主体、近三年财务履约、诉讼失信处罚、关联冲突、数据保密、廉洁，附查询记录。","明确内部对接人、三年计划和业绩目标；未履程序不得入生态库或以山高产融合作事业部名义业务。","待解释：正文无涉诉准入要求，与附件5异常可有条件通过之间的适用边界。"],"evidence":["F04原表全套及营业执照、资质、财报、查询记录、产品资料","试点验证与合作协议"],"owner":"对接负责人、尽调人员、市场小组、综合部、决委","gates":["D1","D3"],"sourceRefs":["主文档p36—37，第37条","附件5p3—4"]},{"id":"P03","title":"二维分类与四种管理强度","status":"原文规则","objective":"按战略重要性和资源依赖度匹配投入。","actions":["战略核心型（高/高）：关键数据、技术或平台，重点投入、资本纽带、高层对接、资源优先。","战略伙伴型（高/低）：独特技术市场，战略协议、项目制松散耦合、联合品牌、不重资产投入。","运营支持型（低/高）：依赖品牌资金、独立能力较弱，标准化服务收费、流程管理、加强风控与标准定价。","市场探索型（低/低）：小规模试错、轻度管理、备案与结果考核；不因此免除统一准入与项目决策。"],"evidence":["附件5分类定级、审批及复查结论"],"owner":"公司对接负责人、综合部与决策委员会","gates":["D1","D3"],"sourceRefs":["主文档p37—38，第38条（一）","附件5p4"]},{"id":"P04","title":"合作期限、目标与五种实施模式","status":"原文规则","objective":"把合作落成具体区域、项目、交付与年度目标。","actions":["合作期限一般3年；首年合作县区及一体化项目不少于1个，次年及以后各年度不少于2个；营收利润依类型、方式、产品服务另定，不虚构统一值。","联合体：依联合体协议分工共享；项目分包：按分包合同独立履约自负盈亏。","区域授权：特定区域或领域的品牌授权、自主开拓实施与公司监管；股权投资：项目公司按持股分享收益、承担风险。","委托运营：已建成项目按绩效收费或超额分成，公司保留运营分成权；公司运营承接仍须前序C/F/EPC基础。","待明确：县区数与一体化项目数是否分别达标、如何计数及复用，不在系统自行改成单一合并指标。"],"evidence":["三年计划、合作协议、年度目标、项目/区域授权"],"owner":"对接负责人、市场小组、综合部及合作对象","gates":["D1","D3","QC05"],"sourceRefs":["主文档p38—39，第38条（二）（三）","附件5p2、p4"]},{"id":"P05","title":"资源与有条件过程资金支持","status":"原文规则；跨年口径待解释","objective":"资源授权与资金支持均绑定真实项目和已审批实施。","actions":["依规开放品牌、渠道、产业资源，按项目规模出专项授权函；交流函、业务授权函仅限具体业务，不挪用。","所有合作项目统一招投标、审计、核算；审核不通过提示风险，公司不再参与，合作对象自行安排后续。","过程资金仅对审核通过且公司中标或签约项目，在风险可控、合规审批、有具体实施环节前提下支持。","占用原则不超过6个月且不超过当年会计年度末；特殊经决委批准最长12个月且不超过一个完整会计年度。","跨年期限、起止计时、利息或收费、担保及续期操作未完整定义，需综合部解释，不把12个月自动当可跨年权限。"],"evidence":["中标/合同、实施环节、风险及资金审批","授权函、资金台账与到期安排"],"owner":"项目经理、综合部财务风险合规、决委","gates":["D3","QC03","QC06"],"sourceRefs":["主文档p39，第38条（四）"]},{"id":"P06","title":"三维贡献与多收益结算","status":"原文规则；对账电子化为建议","objective":"事先约定、按证据结算，不口头分配。","actions":["按资金贡献、技术贡献、市场贡献三个维度事先约定分配方案。","明确咨询费、工程利润、运营分成、数据收益各类收入的比例、支付节点和结算方式；本稿不设统一比例。","合同约定权责、收益预期与波动安排；公司只就协议明确事项有限共担。","建议：客户应收与伙伴应付分别建账，依实际协议确定履约、验收或回款是否结算前提；不自动假设背靠背付款。"],"evidence":["附件5合作方案及分配协议","履约/贡献、结算与收付证据"],"owner":"合作对接负责人、项目经理、综合部财务法务","gates":["D1","D3","QC06"],"sourceRefs":["主文档p36、40，第36、38条","附件5p2、p4"]},{"id":"P07","title":"履约评价、退出与数据回收","status":"原文规则；权限细化为建议","objective":"异常有预警、整改、退出、清算和交接。","actions":["触发：能力不达、违规、业绩对赌未完成、产值不达标、损害公司利益或数据安全。","程序：预警→评估→限期整改→终止合作并清算；遗留项目交接与数据收回。","合作数据仅用于约定目的范围，未经书面同意不向第三方披露、复制、转让或另作他用；终止后依约删除或返还。","建议：未结收付、质保、客户服务与知识产权分别移交，撤账号和共享访问；保留依法依规需留存资料与审计证据。"],"evidence":["履约评价、预警与整改","退出清算、遗留项目移交","数据返还/删除及授权回收证据"],"owner":"公司对接负责人、项目经理、综合部、数据责任人（建议实施角色）","gates":["QC05","QC06","D5"],"sourceRefs":["主文档p40，第39、40条","附件5p4"]}],"sourceLegend":{"主文档":"《山高产融（山东）数字技术有限公司全链路一》，41页","附件1":"《项目线索登记表》，2页","附件2":"《项目立项审批表》，2页","附件3":"《项目商机情况表》，7页","附件5":"《合作事业部审批表》，4页"},"governanceConflicts":[{"id":"C01","title":"分级授权与逐段决委确认","evidence":"正文第22条允许小组级在权限内审批，附件3说明2/4无例外要求各段和结项决委确认。","handling":"并列展示，不自行放宽；阶段确认与业务决策是否拆分由综合部解释、必要时决委审议。","sourceRefs":["主文档p25","附件3p7"]},{"id":"C02","title":"EPC连带责任边界","evidence":"第7条p6称不承担任何连带责任，第13条p17要求联合体协议明确连带责任范围。","handling":"合同、联合体结构及适用上位规则逐项法务审查，不宣称内部指引可排除对外法定责任。","sourceRefs":["主文档p6、p17"]},{"id":"C03","title":"最低IRR阈值与低阈值例外","evidence":"正文第24条“不得低于”最低收益阈值；附件2允许低于时专项说明报决委。","handling":"数值缺失；规则可否豁免须公司解释，工具不默认放行。","sourceRefs":["主文档p27","附件2p2"]},{"id":"C04","title":"无涉诉与异常有条件准入","evidence":"第37条准入要求无失信与涉诉，附件5允许任一异常列有条件通过。","handling":"不得将有条件通过直接解释为豁免禁止情形，需明确可 预收；财务复核后生成核销。","output":"收款凭证、核销分配、未认领余额","control":"使用银行流水唯一标识防重；金额相同不等于同一笔款；不得超额核销。","status":"根据材料要求形成的系统化操作建议","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第14条，p18—19","第27—34条，p28—34","第38条，p38—40","《附件3.项目商机情况表》p3—7"]},{"id":"F06","title":"现金分配与伙伴结算","gate":"S7回款质控","input":"有效合作协议、权益批准版本、履约验收、可用资金和发票资料","action":"按约定基数及先决条件计算结算候选，扣除已结算、退款和争议保留；复核后走应付及付款审批。","output":"伙伴结算单、应付记录、付款回执","control":"资金/技术/市场贡献的分配需事先约定；运营监管资金按第14条既定顺序处理，具体合同及上位规则校准后固化，禁止把收款率当可分配利润或直接自动付款。","status":"根据材料要求形成的系统化操作建议","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第14条，p18—19","第27—34条，p28—34","第38条，p38—40","《附件3.项目商机情况表》p3—7"]},{"id":"F07","title":"冲红、退款与反向核销","gate":"D3签约/S7回款质控","input":"合同撤销或调整、发票更正原因、退款审批和原始凭证","action":"保留原记录，通过红冲、反向分配或调整单纠正；同步更新应收、现金、伙伴结算和项目指标。","output":"调整链、退款凭证、余额重算结果","control":"禁止直接删改已确认流水；同一调整请求保持幂等，并防止重复退款。","status":"根据材料要求形成的系统化操作建议","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第14条，p18—19","第27—34条，p28—34","第38条，p38—40","《附件3.项目商机情况表》p3—7"]},{"id":"F08","title":"质保尾款与关闭检查","gate":"S7回款质控/D5关闭","input":"质保条款、保留金、未结争议、剩余应收和应付","action":"主文档第28条以交付完毕、回款结清或依约终止后履行关闭决策为原则；附件3允许有条件结项但须决策委员会明确条件。尾款与遗留事项单列，并按经裁定规则决定能否有条件结项。","output":"尾款跟踪、关闭清单或未结事项移交","control":"原件存在主文档关闭原则与附件3有条件结项的适用差异，待综合部解释；尾款未清不得标财务结清，未经决策委员会结项决策不得最终归档。","status":"根据材料要求形成的系统化操作建议","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第14条，p18—19","第27—34条，p28—34","第38条，p38—40","《附件3.项目商机情况表》p3—7"]},{"id":"F09","title":"合同变更重算与复批","gate":"D4 重大变更决策","input":"变更请求、签署生效版本、进度与财务余额","action":"评估金额、范围、工期、成本、税费、付款及伙伴权益影响；形成新基线并关联旧版本。","output":"合同与预算新版本、差额调整、受影响事项任务","control":"重大变更须先履行D4变更决策、综合部法务合规审核并签订生效变更协议，再按生效范围实施。变更生效前保留原基线，不得把未签谈判结果当有效修改，不得先执行后补审批。","status":"根据材料要求形成的系统化操作建议","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第14条，p18—19","第27—34条，p28—34","第38条，p38—40","《附件3.项目商机情况表》p3—7"]}],"metrics":[{"name":"合同收款完成率","formula":"该有效合同版本下累计净收款 ÷ 有效合同含税应收总额","scope":"净收款＝已确认到账且分配至该合同的收款－已确认退款；分母零或合同额待定时显示不适用。预收计入的规则应单列。","owner":"财务","warning":"不等同收入完成率或项目利润率。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"到期应收未收余额","formula":"已达到合同约定到期条件的应收金额－对应累计有效核销金额－已批准减免或调整","scope":"按应收明细、币种和数据时点汇总；争议款单列，不因争议自动移除。","owner":"财务","warning":"合同节点预测款与账面应收应分别列示。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"应收账龄","formula":"统计日－应收初始确认日（自然日）","scope":"按截至统计日仍有未核销余额的应收明细计算账龄，并按金额加权或分段汇总；初始确认日缺失时列待核，不默认使用开票日或合同到期日。跨币种不直接相加，分段阈值由财务批准。","owner":"财务","warning":"应收账龄反映自初始确认以来的存续时间，须与逾期天数分列，不能混用。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"预算执行差额","formula":"批准预算－实际成本－已承诺未发生的剩余金额","scope":"按同币种、同税口径和同成本分类核算；实际发生后须消除承诺的对应部分。","owner":"项目经理与财务","warning":"不能把采购承诺全额与实际重复相加。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"完工估算成本 EAC","formula":"累计实际成本＋尚需完成成本估算 ETC","scope":"ETC 包含预计未发生承诺和未承诺剩余工作，注明估算依据、日期及置信范围。","owner":"交付负责人","warning":"EAC 为管理估算，不替代财务实际成本。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"预计项目毛利率","formula":"（预计不含税收入－预计可归属成本）÷ 预计不含税收入","scope":"成本范围、分摊规则、币种和税口径需财务确认；收入为零或待定时不计算。","owner":"财务与经营负责人","warning":"区分预测毛利、确认毛利和现金净额。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"项目累计净现金","formula":"累计项目净收款－累计归属该项目的实际净付款","scope":"收款扣退款、付款扣退回款；内部划拨、代收代付、税费和融资项目需单列。","owner":"财务","warning":"现金为正不等于项目盈利。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"峰值资金缺口","formula":"预测期间累计净现金流最低值的负数部分","scope":"按明确日期粒度、收付节点和情景假设计算，分别呈现基准与延迟情景。","owner":"财务","warning":"不得以未经客户确认的付款承诺填平缺口。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"伙伴可结算金额","formula":"按有效协议计算的累计应结算权益－累计已确认结算－批准扣减或保留","scope":"结算基数可能是收款、收入、毛利或固定里程碑，必须明确选定，禁止混用。","owner":"合作管理与财务","warning":"结算候选须审核后进入应付，不能触发自动付款。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"三账一致性差异","formula":"合同计划、业务履约台账、财务账簿按约定关联后的差异项数量与金额","scope":"按合同版本、节点、发票、应收、收款和核销链逐项核对；合法时间差与错误差异分别标注。","owner":"财务与项目运营","warning":"差异不应通过直接改账清零，必须有处理原因和凭证。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—6","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§5.1"]},{"name":"逾期天数","formula":"max（0，统计日－合同有效到期日）（自然日）","scope":"按截至统计日存在未清偿余额的应收或合同收款节点计算；合同有效到期日须由有效合同版本及已满足的到期条件确定。到期日、条件触发日或变更生效状态缺失时列待核，不默认使用开票日或应收初始确认日。","owner":"财务确认日期口径，市场部负责催收，项目经理协调阻塞","warning":"尚未到期显示0天；日期未知显示待核，不能以0天掩盖缺失。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—7","核心包/01_方法论框架/LTC模式深度解读与治理体系.html §3、5.1","公司主文档第24、26—29、34条"]},{"name":"线索有效转化率","formula":"该批次内截至统计时点已转为正式商机的有效唯一线索数 ÷ 同批次完成有效性核验且被销售接收的有效唯一线索总数 × 100%","scope":"批次按有效线索被销售接收日期落入统计期固定；以lead_id去重，合并后保留原始映射，一条线索只计一次有效转化。分子须有资格确认和商机关联证据。同期新增量不能替代该批次分母；未转化、培育中与终止分别列示。分母为0时不计算。","owner":"综合部销售管理维护口径，市场部负责转化，LTC流程负责人复核","warning":"不得用全部新建线索或当月商机数混算；需同时展示批次规模、观测截止时点和仍在培育数量。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—7","核心包/01_方法论框架/LTC模式深度解读与治理体系.html §3、5.1","公司主文档第24、26—29、34条"]},{"name":"立项通过率","formula":"同批次立项申请中截至统计时点最终获批的唯一申请数 ÷ 该批次正式提交且受理的唯一立项申请总数 × 100%","scope":"批次按首次正式受理日期固定；同一申请退回补充和重提不重复计数，改为新项目时须保留拆分依据。分子仅纳入正式批准，待审、暂缓、不通过和撤回分别呈现并保留在受理批次分母；有条件批准与条件未闭环单列，不伪装为无条件通过。分母为0时不计算。","owner":"综合部流程管理汇总，项目经理对材料负责，决策机构确认决议","warning":"固定分母和统计截止时点，不能通过剔除待审或不通过申请提高通过率。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—7","核心包/01_方法论框架/LTC模式深度解读与治理体系.html §3、5.1","公司主文档第24、26—29、34条"]},{"name":"投标胜率","formula":"同批次已形成终局结果的对外投标中，中标的唯一投标标段数 ÷ 同批次已形成中标、未中标、废标或主动撤标终局结果的唯一投标标段总数 × 100%","scope":"批次按实际对外提交投标日期固定，按bid_id与标段去重；分子须有正式中标通知或可核验公示。联合体同一标段只计一次。废标和对外提交后的主动撤标计入未成功分母，不通过删除失败记录提高胜率。尚待结果及招标方取消的标段分别披露，另报全批次结论覆盖率；招标方取消不计已决胜负分母但须保留记录与依据。分母为0时不计算。","owner":"市场部投标组织负责，综合部招采和销售管理复核","warning":"不得按签约额代替投标标段数，亦不得把尚未揭晓投标计为中标；金额胜率如需使用应另设指标。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—7","核心包/01_方法论框架/LTC模式深度解读与治理体系.html §3、5.1","公司主文档第24、26—29、34条"]},{"name":"按期验收率","formula":"统计期内按有效基线应完成验收的里程碑中，在约定验收截止时点前获得合同要求的正式验收结论的里程碑数 ÷ 同期有效基线应完成验收的里程碑总数 × 100%","scope":"批次由统计期内到期的milestone_id确定，分母含已逾期未验收项；以客户授权确认及有效验收证据时间为准，内部完成时间不得替代。基线变更须在原到期前履行批准并生效，保留旧日期和变更原因；逾期后改期不追溯美化原期达成率。分母为0时不计算。","owner":"项目经理和FR交付负责人负责，质量岗位复核，客户授权代表确认验收","warning":"分批验收须事先明确里程碑拆分规则；拒收、整改中和部分验收分别披露，不按任务勾选判断。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—7","核心包/01_方法论框架/LTC模式深度解读与治理体系.html §3、5.1","公司主文档第24、26—29、34条"]},{"name":"到期回款率","formula":"统计期内到期的有效合同收款节点中，于各节点有效到期时点前已确认并分配的净现金收款金额 ÷ 同批次到期应收净额 × 100%","scope":"批次由有效合同节点到期日落入统计期确定，分母按同币种同税口径扣除到期前已批准生效的减免调整。分子以财务确认的银行到账及有效分配为准，提前收款可计入对应节点，单节点计入金额不超其到期应收；退款及反向核销在统计截止时点据实重算并留痕。到期日或条件未核定的节点列待核，不默认为0；非现金冲抵、股权权益与运营收益权另列。分母为0时不计算。","owner":"市场部负责合同节点催收，综合部财务确认到账、分配和应收口径，项目经理协调履约阻塞","warning":"该指标衡量按期现金收回；期后收回仍展示为补收，不能回填为当期按期收款，也不等同累计合同回款率。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—7","核心包/01_方法论框架/LTC模式深度解读与治理体系.html §3、5.1","公司主文档第24、26—29、34条"]},{"name":"审批条件按期闭环率","formula":"统计期内到期的审批附加条件中，在有效截止时点前由指定复核人确认关闭的唯一条件数 ÷ 同批次到期应闭环的有效唯一条件总数 × 100%","scope":"批次由condition_id的有效截止时间落入统计期确定；分母包含逾期、未完成和复核中条件。分子须有完成证据与指定复核人的确认时间，执行人自行勾选不算关闭。期限调整或取消须在原到期前经原授权机制批准并生效，保留原条件和变化历史；逾期后延期不追溯改善原期结果。分母为0时不计算。","owner":"条件责任人执行，指定专业复核人验真，综合部流程管理汇总，原决策机构监督","warning":"不得用有条件批准代替刚性前置审核；本指标仅适用于正式规则允许附加条件的事项，不能据此先执行未批准重大变更。","status":"建议指标口径，非材料中已批准公式","sourceRefs":["《附件3.项目商机情况表》p4—7","核心包/01_方法论框架/LTC模式深度解读与治理体系.html §3、5.1","公司主文档第24、26—29、34条"]}],"controls":["收款计划金额或比例需与有效合同版本对平；新增、取消或改期保留审批历史。","银行流水、核销、付款及退款均使用业务唯一标识；相同请求重复提交只生成一条有效结果。","跨主体收付款、对公转个人、收款账户变更等异常不得靠 AI 评分放行，应按企业有效制度复核。","结算由合作管理申请、项目确认履约、财务复核、授权人审批和出纳执行；建议在系统中强制职责分离。","坏账、减免、收入确认、税务、诉讼或担保处理由相应专业岗位依有效制度决定，本设计仅提供任务和证据链。","主文档已给出收费、分级和资金期限等文字规则，但金额建议值、收益阈值、账龄阈值、具体授权与指标税口径需区分；已给规则照录并标适用状态，缺失项显示待配置。"],"sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第14条，p18—19","第27—34条，p28—34","第38条，p38—40","《附件3.项目商机情况表》p3—7"],"documentRules":[{"title":"咨询收费底线","rule":"第32条：项目规模1亿元以下，咨询费不低于项目规模3%；1亿元（含）至3亿元（不含），不低于280万元；3亿元（含）以上，不低于360万元，也可按总投资一定比例计取（文中举例1.2%）。低于底线须履行决策委员会审批程序。","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第32条，p31—32"],"uncertainty":"1亿元附近的分段金额存在跳变；“也可按比例”的底线关系与审批适用需财务/综合部解释，不生成自动最终报价。"},{"title":"咨询费支付方式","rule":"第33条允许直接支付、工程/设备实质业务对冲、项目公司股权或收益抵偿，以及与高速集团内部单位合作项目的收益置换/对冲，可单选或组合。须采用总合同＋补充协议书面固化。","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第33条（一）（二），p32"],"uncertainty":"合同示范文本附件4未在已知材料中取得，须补齐有效模板并作专业审核。"},{"title":"咨询回收节点","rule":"直接咨询按交付里程碑；纾困盘活按银行授信批复一次性回款；咨询带动施工以施工中标公示或合同签订为节点。工程设备冲抵与中标和签约绑定，项目利润应符合正常水平并叠加咨询服务费。","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第33条（三），p32—33"],"uncertainty":"按合同约定落实，不将授信批复自动等同融资到账。"},{"title":"运营收益冲抵前提","rule":"项目实质运营且收益可独立核算；约定冲抵上限、回本周期、最低收益保障线；未达预期时保留未冲抵部分追偿权或转延期咨询费；公司不承担经营兜底或无限投资风险。","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第33条（三）（四），p33"],"uncertainty":"权益、分红和现金分别记账；具体条款效力由专业岗位审核。"},{"title":"运营资金分配顺序","rule":"第14条要求设监管账户，按运营成本→税金→公积金→优先债务本息→优先分红→剩余按股比的固定顺序分配。","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第14条（七）4，p19"],"uncertainty":"该顺序为上传指引文字，需与具体合同、公司章程及适用上位制度校准；本交付未验证账户或分配实际执行。"},{"title":"成本与收入确认","rule":"收入按合同及履约进度遵循信息集团财务管理规定；全链条统一归集、合理分摊，项目单独核算，跨期费用按权责发生制合理暂估。常年顾问列期间费用；专项顾问须上游正式咨询合同生效后招标，凭中标通知书、服务合同和履约成果列项目成本。","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第34条，p33—34"],"uncertainty":"信息集团财务制度、会计科目和实际账簿未取得，不推断详细确认分录。"},{"title":"合作过程资金支持","rule":"审核通过且公司中标或签约、有具体实施环节并经合规审批后，方可有条件支持。原则期限不超6个月且不超当年会计年度末；特殊情形决策委员会同意可延至12个月，但不超一个完整会计年度。","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第38条（四）3，p39"],"uncertainty":"期限表述需由综合部财务给出跨年场景解释，系统不得自行用12个月规则绕过年度限制。"},{"title":"财务复盘以确认数据为准","rule":"附件3结项审计记录合同额、确认收入、成本、毛利、毛利率、净利润、回款率、应收余额，与立项测算偏差逐项说明；以上均以财务确认数据为准。","sourceRefs":["《附件3.项目商机情况表》p6—7"],"uncertainty":"主表未定义各指标分母与税口径，以下指标定义是建议口径，须财务批准。"}]},"architecture":{"status":"基于主文档和已读取LTC核心知识包形成的建议逻辑架构；包内含方法论、知识库和案例，未发现可据此证明运行时智能体、连接器或生产系统已经部署的证据。现有CRM/OA/ERP清单、接口和数据字典仍待盘点。","systems":[{"id":"SYS01","name":"客户与商机域 CRM","responsibility":"客户主体、联系人授权、线索、商机、销售活动、资格证据和归属。","sourceOfTruth":"客户与商机主记录","connects":["OA审批","合同域","项目域","AI辅助域"]},{"id":"SYS02","name":"流程审批域 OA/BPM","responsibility":"立项、报价、合同、合作、变更与例外审批；执行授权矩阵和会签条件。","sourceOfTruth":"审批实例、决议和授权依据","connects":["CRM","合同域","ERP","项目域","档案域"]},{"id":"SYS03","name":"合同与权益域","responsibility":"合同版本、有效状态、签署证据、范围与收款节点、合作协议和权益基线。","sourceOfTruth":"有效合同版本与受控附件","connects":["CRM","OA/BPM","ERP","项目域"]},{"id":"SYS04","name":"项目交付域","responsibility":"WBS、任务、里程碑、资源、风险、问题、变更、交付物、验收和质保任务。","sourceOfTruth":"履约事实与项目管理基线","connects":["合同域","OA/BPM","ERP","档案域"]},{"id":"SYS05","name":"财务核算与资金域 ERP","responsibility":"预算核算、采购承诺、实际成本、发票、应收应付、到账、核销与付款事实。","sourceOfTruth":"财务账簿和确认流水","connects":["合同域","项目域","银行对账的授权入口","经营分析域"]},{"id":"SYS06","name":"伙伴与采购协同域","responsibility":"伙伴主档、准入与复评、资质、关联关系、协议、订单、履约评价和结算申请。","sourceOfTruth":"伙伴准入状态与受控合作关系","connects":["OA/BPM","合同域","项目域","ERP"]},{"id":"SYS07","name":"档案与证据域","responsibility":"文档元数据、权限、版本、哈希、签署凭证、保留策略、归档和争议保全。","sourceOfTruth":"受控文件及证据快照","connects":["所有业务域的证据引用","AI检索索引"]},{"id":"SYS08","name":"AI辅助域","responsibility":"经权限过滤的检索、抽取、比对、草案与提醒；记录模型版本和人工处置。","sourceOfTruth":"仅管理 AI 运行与建议记录，不取代业务主档","connects":["授权读取业务域","任务队列","人工复核工作台"]},{"id":"SYS09","name":"经营分析与数据服务域","responsibility":"按固定口径汇总漏斗、周期、风险、交付、毛利和现金；区分事实与预测。","sourceOfTruth":"派生视图与指标口径，不反向改写业务账","connects":["各域确认事件","权限服务","指标字典"]}],"entities":[{"name":"Customer","key":"customer_id","fields":"主体名称、统一标识、归属组织、主数据版本、授权范围","owner":"CRM"},{"name":"Lead","key":"lead_id","fields":"来源、客户引用、负责人、去重状态、资格证据","owner":"CRM"},{"name":"Opportunity","key":"opportunity_id","fields":"线索引用、需求版本、采购路径、阶段、资格结论","owner":"CRM"},{"name":"Project","key":"project_id","fields":"商机引用、立项批准、项目负责人、状态、预算与交付基线","owner":"项目域"},{"name":"GateDecision","key":"decision_id","fields":"闸口、业务对象、输入版本、结论、理由、条件、授权依据、审批人及时间","owner":"OA/BPM"},{"name":"ContractVersion","key":"contract_id + version","fields":"项目、签署主体、有效状态、金额口径、范围、验收与付款条件","owner":"合同域"},{"name":"Milestone","key":"milestone_id","fields":"合同版本、交付标准、计划与实际、验收证据、关联收款节点","owner":"项目域"},{"name":"ChangeRequest","key":"change_id","fields":"原基线、变更内容、影响、审批、生效版本及实施记录","owner":"OA/ k":"金额、范围、有效期与版本一致"},{"name":"contract.effective","producer":"合同域","consumers":"收款计划、项目启动、档案","check":"签署证据与生效条件已确认"},{"name":"change.effective","producer":"合同域或OA/BPM","consumers":"项目、ERP、合作权益","check":"只对批准范围生效，旧基线可追溯"},{"name":"milestone.accepted","producer":"项目域","consumers":"开票与应收待办、质保任务","check":"客户验收主体和证据符合合同条件"},{"name":"receipt.confirmed","producer":"ERP","consumers":"核销待办、回款提醒","check":"银行流水去重、金额和币种校验"},{"name":"receivable.allocated","producer":"ERP","consumers":"经营分析、伙伴结算候选","check":"余额不为负，核销分配总额不超到账净额"},{"name":"partner.suspended","producer":"伙伴域 + 批准","consumers":"新增采购冻结、项目风险任务","check":"存量履约与争议处置另行决策，不自动删合作记录"},{"name":"project.closed","producer":"项目域 + OA批准","consumers":"档案、复盘、知识候选","check":"业务、财务、档案关闭状态分别明确"}],"apis":[{"method":"POST","path":"/api/leads","purpose":"创建线索草稿并返回唯一编号","control":"权限校验、幂等键、字段校验、来源记录；不自动判定资格"},{"method":"POST","path":"/api/gate-reviews","purpose":"提交闸口审查快照","control":"对象版本、证据快照和授权矩阵版本必填；提交不等于批准"},{"method":"POST","path":"/api/gate-reviews/{id}/decisions","purpose":"记录授权人的人工决定","control":"审批身份、职责分离、完整会签、版本锁和审计"},{"method":"POST","path":"/api/contracts/{id}/change-requests","purpose":"申请范围和商业条件变更","control":"引用原基线、差异和影响；不直接覆盖有效版本"},{"method":"GET","path":"/api/projects/{id}/evidence","purpose":"按权限读取证据目录","control":"文档级授权、脱敏、只返回授权文件的受控引用"},{"method":"POST","path":"/api/receipts/{id}/allocations","purpose":"财务确认核销分配","control":"并发版本、余额约束、幂等和审批；AI账号无写权限"},{"method":"POST","path":"/api/agent-runs","purpose":"提交受限AI辅助任务","control":"最小数据范围、对象权限、模型许可、输出审查和超时降级"}],"security":[{"title":"角色与范围双重授权","detail":"角色决定可执行动作，组织、项目、客户和文档级范围决定可见数据；拥有审批功能不代表可访问所有项目。"},{"title":"关键职责分离","detail":"申请人与最终审批人、到账确认与高风险调整、合作权益申请与付款执行等岗位按有效制度分离；禁止共享账号代批。"},{"title":"伙伴与外部账号隔离","detail":"伙伴仅访问明确授权的项目子集和交付物，不可读取其他伙伴报价、项目完整毛利、客户无关信息或内部评审。"},{"title":"AI继承原始权限","detail":"检索前过滤权限，生成后复核敏感信息；共享向量索引不得造成跨项目检索泄漏，撤权后索引访问同步失效。"},{"title":"证据与审批不可静默改写","detail":"批准快照引用文档版本与哈希；后改材料触发差异复审，已批准结论保留原输入和理由。"},{"title":"数据最小化与脱敏","detail":"外部模型只接收经批准的必要资料；客户联系人、账户、报价、合同和个人信息按分类规则控制，不写入公开日志。"},{"title":"凭证与密钥管理","detail":"接口凭证放受控服务端秘密存储，最小权限并可轮换；前端、文档、模型提示和导出包不得带密钥。"},{"title":"审计与保全","detail":"记录操作者、对象、动作、前后版本、时间、原因及关联审批；争议项目启用保全并暂停常规删除，期限由正式制度确定。"}],"reliability":[{"title":"版本与并发","detail":"提交、审批和核销携带对象版本；发现同时修改时拒绝覆盖并要求重读，财务余额采用事务校验。"},{"title":"幂等与防重","detail":"请求幂等键、事件唯一标识和业务约束三层防重；重复事件只返回已有结果，不重复创建合同、收款或任务。"},{"title":"跨系统补偿","detail":"业务提交与待发布事件保持一致；消费者失败可重试并进入人工处理队列。已发生财务事实用反向记录补偿，不删原记录。"},{"title":"状态与数据时点","detail":"展示来源系统、最后成功同步时间和失败状态；旧数据显著标识，不用空值或零值表示同步失败。"},{"title":"AI不可用降级","detail":"AI任务超时、输出无来源或低可信时回到人工清单；允许继续人工审批，但不得自动形成通过结论。"},{"title":"恢复与回滚","detail":"配置和规则版本化；上线前验证备份恢复与事件重放。流程版本变更明确在途实例处理，不批量重置历史审批。"}],"deployment":["第一步：以已读公司五阶段五决策点为制度主线，将核心包八阶段映射为活动层；先裁定附件3审批权、收费分段和有条件结项的适用差异，再盘点真实系统和数据归属。","第二步：先跑通线索→商机→立项→合同→交付验收→收款核销的一个受控案例；合作、变更及异常至少各验证一次。","第三步：接口先只读联调，再按明确权限开放必要写入；测试环境使用脱敏数据，与生产账簿隔离。","第四步：AI先辅助检索和预检，指标、审批和财务事实仍由负责系统与授权人员确认。","第五步：试运行通过后确认权限、审计、备份、故障处理和人工替代流程，另行批准生产启用。","本交付是基于已读取资料形成的可审阅流程、知识路由与架构说明；不代表知识包中声明的智能体能力已实现，也未接通生产审批或财务系统。"],"sourceRefs":["核心包/01_方法论框架/LTC模式深度解读与治理体系.html§2、4、5.2、8.1—8.2、9","核心包/01_方法论框架/LTC全流程管理专家矩阵库.html智能体六项能力映射","核心包/02_知识体系/LTC深化体系知识库.html智能体服务矩阵","《山高产融（山东）数字技术有限公司全链路一》第21—29、40条"],"knowledgeAssets":[{"name":"LTC模式深度解读与治理体系.html","type":"理论/治理知识文件","evidence":"已读取本地ZIP对应HTML，涵盖9章理论、门控、治理、指标、成熟度、变革和数字化。","use":"用作方法参考，企业授权、合同与财务规则仍服从公司原件和上位制度。"},{"name":"LTC全流程管理专家矩阵库.html","type":"操作知识文件","evidence":"8阶段×6能力维度，4类支撑体系与6项智能体能力映射。","use":"以阶段诊断、风险识别、工具匹配、协同建议、知识查询、行业叠加路由知识。"},{"name":"LTC深化体系知识库.html","type":"组织协同知识文件","evidence":"铁三角、激励、壁垒、问题风险和服务矩阵。","use":"借鉴协同动作；其中阈值、激励比例、时效及先执行后补审批不作为贵司生效规则。"},{"name":"LTC职能专家要点库.html","type":"专业会签知识文件","evidence":"法务、财务、审计和风险四类专家×8阶段。","use":"为专业岗位生成审查清单，AI不代替专业意见或独立审计。"},{"name":"LTC行业专家弹药库.html","type":"行业知识文件","evidence":"包内说明将能源/电力标为完整实例，其余行业为框架。","use":"应用前核验具体行业章节与参数来源，不将行业案例数值移作本项目事实。"},{"name":"汝州增量配电网/红场1952案例与记忆索引","type":"示例和检索索引","evidence":"包内具有HTML/PDF案例及MD索引，案例不是本项目现状。","use":"仅供路径对照和检查遗漏，项目金额、周期和控制参数严格隔离。"}],"mappingRules":["公司五阶段是制度主线；核心包八阶段是操作细分。按原参考固定映射：ML对应S1—S2（线索管理、商机确认），MO对应S3—S5（商机策划、方案设计、合同管理），MCE对应S6—S8（项目交付、运营回款、移交退出）；不得据此另造审批权。","原核心包治理HTML与深化库的RACI释义不完全一致，最终采用R执行/A最终负责且单项唯一/C事前咨询/I知会；原深化库P参与只保留为来源标记，不混入正式RACI。","知识文件中的紧急先执行后补审批，与公司第26、29条前置审核和未履行程序不得进下一环节冲突，本设计不采纳。","核心包的500万/2000万等分级示例不覆盖公司第22条；第22条100万合同额、3000万项目规模亦明确金额为建议值待审定，涉及C/F等情形无论金额列公司级。","附件3要求每阶段决策委员会确认，主文档第22条允许小组级授权，必须留作冲突项并经综合部/决策委员会裁定，系统不得擅自选宽松路径。","核心参考称九核心实体，但简化图同时画出含发票在内的10种对象；数据落地以明确实体和关系清单为准，以下再扩展项目、预算、审批、伙伴和AI运行实体。"],"highDimensionalMethod":{"sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第8条，p6—8","《高立模方法论_完整版_V2.2》p3—4、9—11（主代理逐页视觉核验）"],"steps":["问题定义与维度识别","数据与情报获取","空间分析","时间分析","事物分析","综合洞察与建议"],"coverage":"空间从九类中至少选择3个相关维度；时间覆盖过去/现在/未来，逐段对照项目自身与更大区域；事物至少两层的V2.2要求与主文档规律/系统/本质三层框架并列审查。","deliveryBoundary":"规律/系统/本质等认知工具用于内部底稿；客户交付仅呈商业逻辑、数据和专业结论。","knownGaps":["V2.2 p9与p10空间充分性标准不同，交付须列实际覆盖而非宣称全覆盖","p5—8部分模型库内容实际为重复迭代计划表，§7仅标题，不声称操作细则齐全","p11评分为材料自述，缺验证底稿，不用于证明本次方案质量"]}},"acceptance":[{"id":"T01","scenario":"同一客户与项目重复登记","given":"已有线索，另一业务人员提交近似名称和相同项目证据","when":"运行预检并提交人工判断","then":"提示候选与依据；原记录不丢失，未经确认不归并，归属裁决留痕。","evidence":"输入快照、候选匹配、人工决定和归并映射","gate":"S1线索质控","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T02","scenario":"资格关键证据缺失","given":"需求存在但预算或采购路径尚未证实","when":"申请进入正式商机","then":"未知项显著展示；按批准规则补证或暂缓，不虚构预算、概率或客户承诺。","evidence":"资格矩阵、缺项任务、决议","gate":"S2商机核实","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T03","scenario":"申请人自批与缺少会签","given":"立项材料齐全但申请人与审批人为同账号，或应有会签未完成","when":"尝试批准","then":"拒绝越权或缺会签推进；公司级和小组级按经正式裁定的授权矩阵执行，附件3每阶段委员会确认与第22条差异未裁定时不可自动放行。","evidence":"权限规则版本、拒绝日志、在途审批状态","gate":"D1立项","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T04","scenario":"报价 8"]},{"id":"T10","scenario":"回款重复通知与并发核销","given":"同一银行流水多次同步，两人同时分配同一余额","when":"重复事件与并发请求到达","then":"只生成一笔有效收款；冲突请求重新读取，禁止重复或超额核销。","evidence":"幂等响应、并发拒绝、唯一记录与余额","gate":"S7回款质控","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T11","scenario":"采购承诺转实际后的重复计算","given":"采购已形成承诺，部分履约后实际成本入账","when":"计算剩余预算和完工估算","then":"相应已发生承诺消除，未履行部分保留；实际与承诺不重复计入。","evidence":"订单关联、实际分录、承诺释放与计算明细","gate":"S6交付启动质控/S7回款质控","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T12","scenario":"退款、红冲与伙伴权益调整","given":"已收款并已形成部分伙伴结算，后发生批准退款","when":"执行反向调整","then":"原凭证保留，生成反向关联，回款、应收与伙伴结算同步重算；重复请求不重复退款。","evidence":"调整审批、原反向凭证、重算及幂等记录","gate":"S7回款质控","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T13","scenario":"尾款未清申请关闭","given":"主体交付完成但质保尾款或争议仍在","when":"申请项目关闭","then":"依据第28条与附件3经裁定的规则决定关闭或有条件结项；尾款与遗留事项责任明确，未结清不得标财务结清，缺委员会结项决策不得最终归档。","evidence":"尾款明细、移交单、关闭决议及责任任务","gate":"D5关闭","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T14","scenario":"伙伴账号跨项目访问","given":"外部伙伴仅获一个项目的指定交付物权限","when":"访问其他项目、内部报价或经营毛利","then":"访问被拒绝；检索与导出同样遵守范围，不因AI摘要泄漏。","evidence":"账号授权、接口拒绝日志、检索与导出测试","gate":"全阶段","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T15","scenario":"AI输出无来源或不可用","given":"AI服务超时、材料缺失或生成结论无法定位证据","when":"提交资格、合同或验收辅助审查","then":"输出明确失败或待核，回退人工清单；不自动通过，不用虚假成功掩盖失败。","evidence":"失败记录、人工接管、闸口状态及复核结果","gate":"全阶段","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T16","scenario":"审批后替换材料","given":"已批准的合同或预算材料被上传新版本","when":"新版本拟继续沿用原审批","then":"旧审批保持原快照，新材料识别差异并按影响复审；无法静默替换批准依据。","evidence":"文件哈希、版本差异、重新审查或不影响说明","gate":"全阶段","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T17","scenario":"跨系统同步失败后恢复","given":"合同已生效但ERP或项目域暂时不可用","when":"事件重试与人工补偿处理","then":"显示未同步状态及数据时点，恢复后只创建一次对应记录，保留完整事件和处理链。","evidence":"待发布事件、重试队列、恢复对账及唯一记录","gate":"D3签约/S6交付启动质控/S7回款质控","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T18","scenario":"失单、暂停及恢复","given":"商机失单或项目暂停，后出现恢复条件","when":"关闭当前状态或申请重启","then":"保留历史原因与成本，停止不适当新增承诺；重启复核资格、合同、预算和伙伴有效性，不直接跳过闸口。","evidence":"状态变更决议、恢复检查、未结事项和新基线","gate":"S2商机核实/D1立项/S6交付启动质控/D5关闭","status":"后续系统/试运行验收用例；本任务未执行真实业务系统测试","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第21—29、34、40条","《附件3.项目商机情况表》相关阶段","核心包/01_方法论框架/LTC模式深度解读与治理体系.html§3、5、8"]},{"id":"T19","scenario":"咨询费非现金冲抵被误计回款","given":"合同约定股权或运营收益冲抵咨询费，尚无现金到账","when":"计算项目回款、未冲抵权益和经营指标","then":"现金、权益和已实现冲抵分别记录，受限于上限、回本周期及追偿条款；不得把未实现权益当到账现金。","evidence":"合同与补充协议、权益明细、实现证据、现金对账","gate":"D3签约/S7回款质控","status":"待系统实现后验收","sourceRefs":["《山高产融（山东）数字技术有限公司全链路一》第33条，p32—33"]},{"id":"T20","scenario":"高立模内部底稿与客户输出边界","given":"研究底稿含规律、系统、本质等内部分析工具及有争议的维度覆盖","when":"生成对客提案","then":"对客保留商业逻辑、数据依据与专业结论，不泄露内部认知标签；维度与来源缺口在内部审查可见，不虚构模型库细节或用自评分背书。","evidence":"内部底稿与对客版本差异、维度覆盖、来源和复核","gate":"D1立项/D2投标","status":"待人工审阅和系统实现后验收","sourceRefs":["《高立模方法论_完整版_V2.2》p3—4、9—11","《山高产融（山东）数字技术有限公司全链路一》第8条"]},{"id":"T21","scenario":"通用库宽松规则覆盖公司制度","given":"知识库检索命中紧急先执行后补审批、500/2000万分级或样例激励","when":"生成审批建议或流程动作","then":"明确显示与公司原文的冲突；按公司已确认制度和上位规则处理，不自动采纳示例阈值、时效或后补审批。","evidence":"知识来源、冲突提示、采用规则版本、授权审批日志","gate":"全阶段","status":"待系统实现后验收","sourceRefs":["核心包/02_知识体系/LTC深化体系知识库.html壁垒打通体系","《山高产融（山东）数字技术有限公司全链路一》第22、26、29、43条"]}]},"re }

function value(v,depth=0){if(v===null||v===undefined)return '—';if(typeof v==='boolean')return v?'是':'否';if(typeof v!=='object')return esc(v);if(Array.isArray(v)){if(!v.length)return '—';if(v.every(x=>typeof x!=='object'))return '<ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';return v.map((x,i)=>'<div class="subrecord">'+value(x,depth+1)+'</div>').join('');}return '<dl class="'+(depth?'nested':'')+'">'+Object.entries(v).filter(([k])=>!['id','sourceRefs'].includes(k)).map(([k,x])=>`<div class="field"><dt>${esc(LABEL[k]||k)}</dt><dd>${value(x,depth+1)}</dd></div>`).join('')+'</dl>'+refButtons(v.sourceRefs);}

function analysisFirst(){const a=P.abc;return section('analysis-first',`<div class="note teal"><b>A先形成成果，再交B执行。</b>本轮按你的顺序固定为五步。这里先细化A；B执行、C结果库只定义必要接口。页面是结构审阅稿，尚未接入真实模型、专家、司库或结果存储服务。</div><div class="abc-map"><a href="#analysis-first"><b>A</b><strong>分析与成果形成</strong><small>参数 → 纪要 → 思路 → 分析 → 分类成果</small></a><span class="abc-arrow">→</span><a href="#b-handoff"><b>B</b><strong>执行</strong><small>选定成果＋适用授权＋执行基线</small></a><span class="abc-arrow">→</span><a href="#c-results"><b>C</b><strong>结果库</strong><small>接收A成果与B实绩，反馈下一轮A</small></a></div><p class="intro">C从A产生成果时开始接收版本和状态；A的分析成果、B的实际执行结果分别留存。</p><h3>先配置常备底座，再按项目顺序输入</h3>${value(a.foundation)}<h3>A的五步顺序</h3><div class="a-flow">${a.steps.map((x,i)=>`<button class="btn a-step-node" data-a-step="${i}"><span>${x.id}</span><b>${esc(x.title)}</b><small>查看输入、产出与通过条件</small></button>`).join('')}</div><div class="note"><b>有先后依赖，也允许补充修订：</b>A1—A3先形成共同输入包，A4在统一版本上分析，A5按用途出成果。会议或分析发现新事实时，回写前序版本并重算受影响部分；不把新旧事实静默拼接。</div>${tools('analysis-first')}${records(a.steps,'a-step')}<h3>A4：五类分析使用同一份输入包</h3><div class="table-wrap"><table><thead><tr><th>分析角色</th><th>主要输入</th><th>主要产出</th><th>边界</th></tr></thead><tbody>${a.views.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${value(x.inputs)}</td><td>${value(x.outputs)}</td><td>${esc(x.control)}</td></tr>`).join('')}</tbody></table></div><div class="note"><b>司库定义：</b>${esc(a.treasuryMeaning)}</div><div class="editorial"><h3>统一汇总的顺序</h3><p>各路意见 → 核对输入与来源 → 共同结论 → 分歧及反对证据 → 需要补证的事实 → 可选方案 → 负责人审阅。多模型投票不能替代事实和专业审核。</p><p>可并行的是A4中的不同分析模块；有顺序的是A1—A5的材料与成果依赖。</p></div><h3>A5：先按六类组织成果，再按需要选择</h3><p class="intro">“成果类型”决定用途和读者；同一类型还可以包含不同候选方案。输出多少份、选哪份执行分别记录。</p>${records(a.deliverables,'a-output')}<div class="note teal"><b>本轮A的验收：</b>材料先后清楚；事实、意见、假设分开；五路分析有统一输入版本；成果用途与状态明确；选定与授权分别留痕；能形成交给B的明确执行基线。</div>`,'项目参数 → 会议纪要 → 核心思路 → 专家与多视角分析 → 分类成果。','用户定义＋A结构设计');}
function executionHandoff(){const a=P.abc;return section('b-handoff',`<div class="note teal"><b>${esc(a.bEntry)}。</b>“生成成果”“认可方向”“选择方案”和“批准执行”分别记录，不能相互替代。</div><h3>从A带入B的交接包</h3>${value(a.handoff)}<div class="columns"><article class="editorial"><h3>B负责什么</h3><p>按已批准范围拆任务、配置负责人和资源，执行动作，记录进度与异常，提交交付物和验收证据。业务执行仍遵守适用的公司五类决策与专业审核。</p></article><article class="editorial"><h3>与已有LTC内容的关系</h3><p>下方八阶段、角色、表单、风控和财务内容，作为A4分析及B执行的制度参考。A1—A5的输入顺序保留独立位置。</p><p>本轮只定交接接口；执行系统的操作、权限和自动化另行细化。</p></article></div>`,'B承接被选定且取得适用授权的成果，形成可核验执行。','B接口 · 待实施');}
function resultsLibrary(){const a=P.abc;return section('c-results',`<div class="columns"><article class="editorial"><h3>C先接住A</h3><p>参数与纪要版本、核心思路、专家和模型分析、方案候选、分类成果、分歧、审阅与选定记录。</p><p>分析稿、预测、建议和未核事实，保留其状态与来源。</p></article><article class="editorial"><h3>C再接住B</h3><p>执行基线、任务进度、实际操作凭据、交付物、测试、验收、收付和复盘结果。</p><p>实际结果关联原方案和输入版本，用于解释偏差、修订知识与启动下一轮A。</p></article></div><h3>每条结果的必要字段</h3><div class="result-fields">${a.resultFields.map(x=>'<span>'+esc(x)+'</span>').join('')}</div><h3>四类状态分别记录</h3>${records(a.resultStates,'c-state')}<div class="note">C是结果与经验的承接库，从A成果形成时即可留存；B执行中持续追加。当前只定义字段、状态和接口，没有声称已经实现真实数据库、文件上传或企业知识检索。</div>`,'C同时接收A分析成果与B执行事实，并保留可追溯的版本和验证状态。','C接口 · 待实施');}

function overview(){return section('overview',`<div class="columns"><article class="editorial"><h3>核心判断：以公司规则收口</h3><p>LTC连接客户需求、方案承诺、合同义务、履约证据与资金回收。公司业务同时覆盖 <b>C + F + EPC + O + AI</b>，业务能力可以组合；审批、责任、财务和数据证据必须连贯。</p><p>本次建议采用一条管理主线、三种对应视图。以公司五阶段和五类决策为准，八阶段用来拆解任务，商机表四段用来滚动填报。五种能力并非五个必须依次发生的时间阶段。</p></article><article class="editorial"><h3>范围与交付层级</h3><p><b>本期交付：</b>可审阅业务蓝图、规则与表单映射、异常处置、拟议AI与系统契约。正文可在线审阅、搜索与打印。</p><p><b>后续实施：</b>真实账号、在线审批、银行/ERP/OA连接、智能体运行和业务验收，均需另行落地。本HTML不产生真实审批、记账、开票、发送或资金操作。</p></article></div><div class="note teal"><b>证据优先级：</b>适用上位规定与集团制度 → 公司已有效指引和授权 → 原表及合同 → LTC方法参考 → 本次整合建议。已取得的41页文件未附发布审批证据，本文“原文规则”表示材料明文，不代替确认其生效版本。法律、融资及税务适用性仍由对应专业岗位核验。</div><div class="triple"><article class="editorial"><span class="tag">原文依据</span><p>有明确书名、条号、页码或包内文件定位。引用按钮可查看来源名称与定位；原件由资料持有人保管。</p></article><article class="editorial"><span class="tag design">整合设计</span><p>阶段映射、标准RACI、补充表单、AI职责、事件与接口为落地建议，等待审定。</p></article><article class="editorial"><span class="tag pending">待审事项</span><p>来源冲突、缺失阈值和缺失模板集中列明，不以默认值掩盖空缺。</p></article></div><h3>三条贯穿线</h3><div class="table-wrap"><table><thead><tr><th>贯穿线</th><th>核心对象</th><th>必须回答</th></tr></thead><tbody><tr><td>责任链</td><td>客户、项目经理、市场、研发、综合部、决策主体、伙伴</td><td>谁编制、谁审核、谁决策、谁执行、谁对结果负责？</td></tr><tr><td>证据链</td><td>XS → LX → SJ → 合同 → 验收/变更 → 收付凭证 → 归档</td><td>每次流转依据哪个版本？认可与签署权限是否有效？</td></tr><tr><td>资金链</td><td>投资资金、公司收入、项目成本、应收应付、实际现金</td><td>钱属于谁、如何来、何时收、怎样分、缺口与退出由谁承担？</td></tr></tbody></table></div>${refButtons(['主指引 第21–29、41–44条','核心包 LTC模式深度解读与治理体系 第1–5章'])}`,'先理解业务闭环和依据边界，再进入具体节点。');}
function flow(){return `<div class="flow-grid">${P.stages.map((x,i)=>`<button class="stage-node ${i===0?'selected':''}" data-stage="${i}" aria-label="查看${x.id} ${x.name}详情" aria-pressed="${i===0}"><span class="idx">${x.id}</span><strong>${x.name}</strong><small>${x.company}</small></button>`).join('')}</div><div class="lifecycle-bands"><span style="grid-column:span 2">机会识别 · D1立项</span><span style="grid-column:span 2">方案组盘 · 技术评审</span><span>投标签约 · D2 / D3</span><span style="grid-column:span 2">交付回款 · 验收 / 运营</span><span>变更关闭 · D5</span></div>`;}
function panorama(){return section('panorama',`${flow()}<div class="note teal"><b>D4重大变更横跨所有已承诺范围。</b> 项目范围、价款、工期等发生重大变化时，回到变更审核与决策，批准后更新合同、预算、验收和回款基线。开票与回款按合同节点贯穿全过程，不等待S7才启动。</div><div class="mapping"><table><thead><tr><th>公司五阶段（管理主干）</th><th>LTC八阶段（执行视图）</th><th>附件3滚动填报</th><th>关键流转与证据</th></tr></thead><tbody><tr><td>机会识别</td><td>S1线索管理、S2商机确认</td><td>附件1 / 附件2；方案阶段前端</td><td>客户认可思路 → 机会评估 → 客户认可深化建议书/战略协议 → 五维论证与D1立项</td></tr><tr><td>方案组盘</td><td>S3商机策划、S4方案设计</td><td>方案阶段</td><td>技术方案 + SPV/伙伴 + 资本金/债务/政策资金 + 收益回收路径</td></tr><tr><td>投标签约</td><td>S5合同管理</td><td>方案阶段 → 实施阶段</td><td>审核 → D2投标 → 一致性检查 → D3签约 → 合同交接</td></tr><tr><td>交付回款</td><td>S6项目交付、S7运营回款</td><td>实施阶段、运营阶段</td><td>里程碑、分型验收、付款计划；运营以参与前序环节为前提</td></tr><tr><td>变更关闭</td><td>D4变更贯穿；S8移交退出</td><td>各阶段变更；结项审计阶段</td><td>批准变更 → 更新基线；交付/回收或依约终止 → D5关闭与后评价</td></tr></tbody></table></div><h3>主要分支：每条都有落点</h3><div class="table-wrap"><table><thead><tr><th>触发</th><th>流向</th><th>保留记录</th></tr></thead><tbody><tr><td>客户待沟通 / 机会不符合正面清单</td><td>继续跟踪 / 线索归档</td><td>XS不变、原因、跟进责任、下一次动作</td></tr><tr><td>审核不通过 / 条件未落实</td><td>退回补证或整改；停止后续决策/执行</td><td>原审核意见、整改、复核与新版本</td></tr><tr><td>未中标 / 合同终止</td><td>失标复盘或依约退出；仍清理既有债权义务</td><td>投入、保函/保证金、成果权属、费用与档案</td></tr><tr><td>不适用长期运营</td><td>由S6转S8的适用性分支（建议路径，须履行阶段/关闭决策）</td><td>不适用理由与批准，不伪造运营记录</td></tr><tr><td>验收完毕但欠款/质保未清</td><td>继续应收与剩余义务管理；符合约定的终止另行决策</td><td>应收、催收、争议、质保、责任人与承继安排</td></tr><tr><td>运营产生续约/新场景</td><td>新XS回到S1；旧合同保持独立生命周期</td><td>来源项目ID、权益与授权边界、原项目责任</td></tr></tbody></table></div>${refButtons(['主指引 第21、24–29条','附件3 第1–7页','核心包 LTC全流程管理专家矩阵库'])}`,'单击任一阶段节点，直接定位执行手册。参考模块映射：ML线索管理=S1–S2；MO商机管理=S3–S5；MCE合同执行=S6–S8。不改变公司决策权限。');}
function stageBody(x,compact=false){return `<div class="stage-meta">${esc(x.company)} ｜ 原表分组：${esc(x.formPhase)}<br>牵头：${esc(x.owner)}</div><p>${esc(x.goal)}</p><div class="columns"><div><h4>输入</h4>${value(x.inputs)}<h4>执行动作</h4>${value(x.actions)}</div><div><h4>输出与交接</h4>${value(x.outputs)}<h4>通过与流转</h4><p>${esc(x.gate)}</p><h4>风险和边界</h4><p>${esc(x.risk)}</p><h4>建议数据变化</h4><p>${esc(x.data)}</p></div></div>${refButtons(x.sourceRefs)}`;}
function execution(){return section('execution',`<div class="record-tools">${P.stages.map((x,i)=>`<button class="btn ${i===0?'primary':''}" data-select-stage="${i}">${x.id} ${x.name}</button>`).join('')}</div><div id="activeStage" aria-live="polite"></div><div class="note">以下八份执行底稿保留完整内容，便于逐项审阅或打印。上方切换用于集中查看；“打印全稿”会展开所有阶段。</div>${tools('execution')}${P.stages.map((x,i)=>`<details class="record" id="stage-${i}"><summary><span class="id">${x.id}</span><span class="record-title">${x.name} · ${x.company}</span><span class="tag design">执行映射</span></summary><div class="record-body">${stageBody(x)}</div></details>`).join('')}`,'统一使用：输入 → 动作 → 证据 → 责任 → 决策 → 异常 → 数据。');}
function gates(){return section('gates',`<div class="note red"><b>不得以AI评分、管理层口头同意或“紧急”代替审批。</b> 公司五类正式决策是立项、投标、签约、变更、关闭；补充质控点只检查证据，不扩大或改变决策授权。</div><div class="columns"><div class="editorial"><h3>项目分级与授权</h3><p>C或F、SPV组建、引入股权合作、政府特许经营、跨区域统筹及“三重一大”等，不论金额大小列公司级。公司级由决委会决策，市场小组级依有效授权额度审批、逐级上报。</p><p>单项目合同额≥100万元或项目规模≥3000万元为材料建议值，需审定后施行。不得用参考库的其他金额分档覆盖。</p></div><div class="editorial"><h3>专业审核 → 决策 → 执行</h3><p>政策合规、技术方案、财务经济、法务合同、风险按节点会审。签约前财务、法务合规、风险审核是刚性前置。</p><p>审核不通过、条件未落实、无有效决策均停止流转。附件3逐阶段决委会确认与小组授权的衔接另列待审。</p></div></div>${tools('gates')}${records(G.gates,'gate')}<div class="sandbox"><h3>门控规则演示 <span class="tag design">本地说明</span></h3><small>只演示材料中“审核与决策前置”的逻辑。勾选不构成真实证据或业务批准，不写入系统。</small><div class="control-grid"><label><input type="checkbox" id="evidenceCheck">必需证据完整且版本有效</label><label><input type="checkbox" id="reviewCheck">所有适用专业审核已通过</label><label for="decisionSelect">决策结论 <select id="decisionSelect"><option>未决策</option><option>通过</option><option>有条件通过</option><option>不通过</option></select></label><label><input type="checkbox" id="conditionsCheck">附加条件已由责任岗位验证闭环</label></div><div class="outcome" id="gateResult" aria-live="polite"></div></div>${refButtons(['主指引 第22、26、29条','附件2 第2页','附件3 第7页'])}`,'五类正式决策 + 关键证据质控；项目经理负责组织，审批权限来自有效授权。流程负责人建议由综合部归口，负责规则、表单、指标口径和版本变更；任命及授权待公司确认。','原文依据＋执行设计');}
function roles(){return section('roles',`<div class="note teal"><b>项目经理是全流程第一责任人，实行终身负责制。</b> 市场部负责客户、商机、投标、合同与回款；创新研发中心负责策划、融资设计和技术支持；综合部覆盖销售管理、法务合规、财务、招采与合同管理。下列分工不表示已新增部门或岗位编制。</div><h3>RACI责任矩阵 <span class="tag design">建议审定</span></h3><p class="intro">R执行，A对此项结果承担最终责任，C会商，I知悉；A/R表示同一责任角色兼执行。每行仅一个A，决策主体按公司级/小组级有效授权路由。专员分别出具专业意见，不共用审批账号。</p><label class="statusline" for="roleFilter">高亮角色：</label><select id="roleFilter"><option value="">全部</option>${P.raciRoles.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}</select><div class="table-wrap"><table class="raci" id="raciTable"><thead><tr><th>事项</th>${P.raciRoles.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${P.raci.map(x=>`<tr><td>${esc(x.task)}</td>${x.cells.map((c,i)=>`<td data-col="${i}" class="${c.includes('A')?'a':c.includes('R')?'r':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${refButtons(['主指引 第23条，第25–26页','核心包 LTC深化体系知识库／职能专家要点库'])}<h3>角色职责、权限与交接</h3>${tools('roles')}${records(G.roles,'role')}`,'标准责任矩阵帮助协作，不能改变法定责任或已签合同义务。');}
function forms(){return section('forms',`<div class="table-wrap"><table><thead><tr><th>原表</th><th>原始编号</th><th>作用</th><th>关键控制</th></tr></thead><tbody><tr><td>附件1 项目线索登记表 · 2页</td><td>XS－8位日期－2位流水</td><td>发现、认可、评估、培育与线索归档</td><td>综合部归口，编号不得变更，双周复盘</td></tr><tr><td>附件2 项目立项审批表 · 2页</td><td>LX－8位日期－2位流水</td><td>五维论证、收益、分级和内部立项</td><td>关联XS；客户认可深化建议书或战略协议；不通过不得提交决策</td></tr><tr><td>附件3 项目商机情况表 · 7页</td><td>SJ－8位日期－2位流水</td><td>一商机一张，方案/实施/运营/结项审计滚动更新</td><td>关联XS/LX/合同；阶段签署和附件；财务数据以财务确认为准</td></tr><tr><td>附件5 合作事业部审批表 · 4页</td><td>HB－8位日期－2位流水</td><td>生态伙伴入库和合作事业部准入</td><td>综合部编号；至少具一类能力；尽调、合规、决委会、协议</td></tr></tbody></table></div><div class="note">编号为业务原号，不随系统ID或表单版本改变。系统内部ID可另建；超过两位流水的扩展、日期定义和并发分配规则须综合部确认，禁止静默改号。原表中的“已归档综合”表示过程证据归档；正式结项归档必须取得相应决策。</div><h3>字段字典与建议补充表单</h3><p class="intro">前四类按原表核对，原字段与数字化建议分开。补充表只用于执行设计，不冒充缺失的附件4、6、7示范文本。</p>${tools('forms')}${records(G.forms,'form')}<h3>一笔事实只记一次，逐层关联</h3><div class="finance-river"><div><b>XS</b>来源与认可</div><div><b>LX</b>投入与五维论证</div><div><b>SJ</b>滚动进度与评审</div><div><b>合同/变更</b>范围与义务基线</div><div><b>验收/收付</b>交付与资金证据</div><div><b>档案</b>关闭决策与历史版本</div></div>${refButtons(['附件1 第2页填表说明','附件2 第2页填表说明','附件3 第7页填表说明','附件5 第4页填表说明'])}`,'四张原表承担主证据链，补充表单补齐报价、变更、验收、收付与退出控制。','原表核对＋字段设计');}
function method(){return section('method',`<div class="model-grid"><article class="model"><div class="big">09</div><h3>空间立体</h3><p>物理、数据、金融、能源、文化、微观、宏观、政策、认知。至少选3维深入分析，九维清单逐项标适用性、证据与未核事项。</p></article><article class="model"><div class="big">03</div><h3>时间立体</h3><p>过去、现在、未来，各自对照项目本身与更大区域；判断历史约束、当前竞争、未来窗口，注明数据时点。</p></article><article class="model"><div class="big">02+</div><h3>深度逻辑解析</h3><p>内部至少调用两类事物认知方法交叉检验。对客成果只保留商业逻辑、数据分析、专业结论和行动建议。</p></article></div><div class="method-steps">${['问题定义与维度识别','数据收集与情报获取','空间立体分析','时间立体分析','深度逻辑解析','综合洞察与建议'].map((x,i)=>`<div><b>0${i+1}</b>${x}</div>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>嵌入位置</th><th>应用问题</th><th>必须留下的证据</th><th>对业务的作用</th></tr></thead><tbody><tr><td>S2机会/立项</td><td>客户是否有真实诉求？政策、资源、收益和风险是否支持投入？</td><td>五维论证、关键事实与未知、客户认可、IRR口径</td><td>形成D1立项材料，不能替审批</td></tr><tr><td>S3–S4策划设计</td><td>谁出资、谁付费、谁运营、谁承担风险？不同时间情景能否平衡？</td><td>交易结构、资本金实缴条件、现金流情景、运营与退出安排</td><td>让组盘、方案与财务相互校准</td></tr><tr><td>S5签约与S6变更</td><td>合同是否忠实表达方案？新事实改变了哪些假设？</td><td>方案/标书/合同差异表，变更影响分析与新批准基线</td><td>防承诺漂移、范围失控和风险转嫁</td></tr><tr><td>S7–S8运营复盘</td><td>实际收入现金与前期假设有何偏差？哪些经验可复制？</td><td>财务确认数据、偏差原因、后评价、适用条件与失效日期</td><td>知识库更新与新机会识别</td></tr></tbody></table></div><div class="note">已实际查看扫描PDF全13页。第5–8页的若干模型章节只有标题或重复迭代计划，不能据此声称拥有完整产业金融、产业周期或平台生态操作模型。第9页与第10页维度覆盖表述不同，本稿的“九维检查＋至少三维深入”是待审整合方案。</div>${refButtons(['高立模V2.2 第3–4、9–10页','主指引 第8条，第6–8页'])}`,'将方法论变成分析底稿和业务证据，保持内部研究与对客成果边界。','原文方法＋整合设计');}
function partners(){return section('partners',`<div class="columns"><article class="editorial"><h3>伙伴是合同协作关系</h3><p>公司以我为主、生态协同。伙伴补足资金、产品技术、市场开拓至少一类能力。合作事业部是外部战略协同单元，与公司合同合作、地位平等，不构成隶属关系。</p><p>未完成准入程序，不得纳入伙伴库或以“山高产融合作事业部”名义开展业务。品牌专项授权不等于集团融资或履约信用背书。</p></article><article class="editorial"><h3>期限、目标与资金支持</h3><p>合作期限一般3年；首年合作县区及一体化项目不少于1个，次年及以后各年度不少于2个，收入利润指标另行约定。</p><p>过程资金支持限审核通过且公司中标/签约、有具体实施环节的项目。原则≤6个月且不超当年末；特殊经决委会≤12个月，跨年度表述待统一解释。</p></article></div><h3>四象限定级</h3><div class="table-wrap"><table><thead><tr><th></th><th>资源依赖高</th><th>资源依赖低</th></tr></thead><tbody><tr><th>战略重要性高</th><td><b>战略核心型</b>：资本纽带、重点投入、高层对接</td><td><b>战略伙伴型</b>：协议牵引、项目合作、避免重资产投入</td></tr><tr><th>战略重要性低</th><td><b>运营支持型</b>：标准服务收费、流程管理、加强风控</td><td><b>市场探索型</b>：轻管理、小规模验证、及时调整</td></tr></tbody></table></div><h3>生命周期</h3><div class="finance-river">${['试点验证','尽职调查','合规审查','决委会决策','签约入库','授权与督导','复查与结算','整改或退出'].map((x,i)=>`<div><b>0${i+1}</b>${x}</div>`).join('')}</div>${tools('partners')}${records(G.partners,'partner')}<div class="note red"><b>两类资金不能混为一谈：</b>伙伴提供资金能力、项目公司融资、公司过程资金支持各有不同主体、条件和责任；公司不得通过品牌授权形成无限兜底。收益分配按资金、技术、市场贡献事先书面约定，退出后交接遗留项目并收回数据与授权。</div>${refButtons(['主指引 第35–40条，第35–40页','附件5 第1–4页'])}`,'从试点到清算形成闭环，项目准入与伙伴准入分别管理。','原文依据＋执行设计');}
function finance(){return section('finance',`<div class="note teal"><b>项目总投资 ≠ 公司合同额；合同额 ≠ 收入；收入 ≠ 开票；开票 ≠ 回款；股权、分成权、入表估值 ≠ 已收现金。</b> 公司账、SPV账和伙伴账分别核算，再按合同对账。</div><div class="finance-river"><div><b>测算/预算</b>收入、成本、IRR、现金流与假设</div><div><b>合同/计划</b>付款触发条件、金额与责任</div><div><b>履约/验收</b>业务事实及客户证据</div><div><b>开票/应收</b>财务确认与账龄</div><div><b>收款/核销</b>银行回单、分配与差异</div><div><b>应付/分润</b>独立审批、对账与结算</div></div><h3>原文明文财务规则</h3>${records(S.finance.documentRules,'finrule')}<div class="sandbox"><h3>咨询费计取口径核对 <span class="tag">第32条原文</span></h3><small>按材料字面展示底线，金额单位万元。仅用于核对条文；不产生报价或市场价格，不能替代专项审批。</small><div><label for="investmentInput">项目投资规模（万元）</label><input id="investmentInput" class="amount-input" type="number" min="0" step="0.01" value="10000"><button class="btn" id="feeBtn">核对口径</button></div><div id="feeResult" class="outcome" aria-live="polite"></div><p class="statusline">1亿元以下不低于3%；1亿元（含）至3亿元（不含）不低于280万元；3亿元（含）以上不低于360万元，或采用审定比例。原文1.2%为举例。低于标准须决委会审批。</p><div class="note">原文在1亿元边界存在300万元附近降至280万元的跳变；3亿元以上固定额与比例方式的选择口径未清。保留问题交综合部解释，不自动修订公司收费规则。</div>${refButtons(['主指引 第32条，第31–32页'])}</div><h3>咨询费回收的三条路径</h3><div class="table-wrap"><table><thead><tr><th>路径</th><th>原文回收节点</th><th>建议台账与异常控制</th></tr></thead><tbody><tr><td>直接支付</td><td>咨询服务交付里程碑；纾困盘活类银行授信批复；带动施工类中标公示或合同签订</td><td>逐笔合同条件、金额、应收、到期、到账核销；未满足条件不虚造收入</td></tr><tr><td>工程/设备采购业务冲抵</td><td>工程或设备采购中标签约，正常项目利润叠加咨询服务费</td><td>关联上游咨询合同与具体业务，核实冲抵凭证和金额；业务合法获取，不以咨询优势违规获工程</td></tr><tr><td>股权/运营收益冲抵</td><td>实质运营且收益可独立核算；明确上限、回本周期、最低收益保障线、未冲部分追偿</td><td>权益台账、未回收余额、实际分红/净现金流、追偿与延期；不得兜底经营或无限投资</td></tr></tbody></table></div><h3>运营监管账户分配顺序</h3><ol class="waterfall">${['运营成本','税金','公积金','优先债务本息','优先分红','剩余按股比'].map(x=>'<li>'+x+'</li>').join('')}</ol><p class="intro">以上顺序为材料第14条明文。具体账户、偿债、可分配利润和法定要求，执行前由财务、法务结合有效合同与上位制度核验，不代表股东可无条件分配现金。</p><h3>财务执行闭环与指标口径</h3>${tools('finance')}${records(S.finance.flow,'finflow')}${records(S.finance.metrics,'metric')}<h3>核算与异常补充控制</h3>${value(S.finance.controls)}${refButtons(S.finance.sourceRefs)}`,'把收益测算、合同义务、实际现金和合作分配分别记清，并形成逐笔关联。','原文依据＋财务设计');}
function risk(){return section('risk',`<div class="triple"><article class="editorial"><h3>第一道防线 · 业务</h3><p>项目经理与市场、研发、实际履约/运营主体负责事实、方案、执行和风险整改。</p></article><article class="editorial"><h3>第二道防线 · 专业控制</h3><p>综合部法务、财务、风险、合规、招采按职责会审。重大事项交有效权限主体决定。</p></article><article class="editorial"><h3>第三道防线 · 监督</h3><p>综合部结项审计及适用上级监督，检查证据和责任；同一岗位操作与复核需分离。此处为功能分层，不表示已设独立审计机构。</p></article></div><div class="note red">材料明示红线：不新增政府隐性债务；不以集团信用背书；不越权承诺授信/政府结果；不采集越权数据；禁止无真实能力纯居间套利、利益输送、围标串标和商业贿赂。出现红线不得以高收益、关系资源或“先干再补”替代审查。</div><p class="intro">每个异常要求触发证据、即时控制、负责人、恢复条件与审计记录。处置时保留历史，不把“关闭风险”操作等同于风险消失。</p>${tools('risk')}${records(G.exceptions,'exception')}${refButtons(['主指引 第3、7、11–15、28–29、35–40条','核心包 LTC职能专家要点库'])}`,'风控贯穿机会、投标、签约、变更、履约、回款、伙伴和数据全过程。');}
function agents(){return section('agents',`<div class="note teal"><b>已取得的是知识文件包，未取得已部署智能体的运行证据。</b> 包内包含理论、专家矩阵、深化知识、行业与职能库、案例和记忆索引；没有经本轮验证的可运行代码、接口服务或模型部署。本节13个助手为基于资料的职责设计。</div><div class="columns"><article class="editorial"><h3>共用调用链</h3><p>任务触发 → 身份与项目权限 → 检索有效资料 → 抽取事实与来源 → 规则检查/生成草稿 → 人工采纳或驳回 → 版本留痕。</p><p>原文与用户资料视为证据数据，不能改变权限、审批规则或执行指令。新事实必须显示来源、时点、待核部分和冲突。</p></article><article class="editorial"><h3>人负责决策和外部动作</h3><p>助手可检索、比对、提醒、编稿和装配材料；不能自动准入、立项、投标、签约、验收、记账核销、支付、删档或对外承诺。</p><p>无证据、扫描识别差、检索失败、权限不明或规则冲突时，输出缺口并转人工，不生成“成功”状态。</p></article></div><h3>拟议助手服务目录</h3>${tools('agents')}${records(S.agents,'agent')}<h3>包内知识资产如何转为可用检索库</h3>${value(S.architecture.knowledgeAssets)}<div class="note">每份资料需保存原文件哈希、版本、发布/失效状态、来源段落、适用行业与项目权限；公司规则和参考示例分库标记。案例参数冲突未澄清前，不作为预算、报价或履约事实。禁止将本地资料自动发送到未经授权的外部模型。</div>${refButtons(['核心包 00_文件说明.md','核心包 LTC全流程管理专家矩阵库 智能体功能映射','主指引 第40条，第40页'])}`,'AI负责辅助识别和整理，业务事实、专业判断与审批始终有明确责任岗位。','拟议能力 · 未部署');}
function architecture(){return section('architecture',`<div class="note">以下为建议逻辑架构，尚未读取现有CRM/OA/ERP的真实产品、接口或部署配置。先确认权威数据来源和权限，再决定集成；优先复用已有系统。</div><div class="arch-layer"><div class="layer-label">工作入口</div><div class="layer-body"><div class="sysbox"><b>项目经理 / 市场</b><small>线索、方案、里程碑、催收</small></div><div class="sysbox"><b>综合部专业岗位</b><small>审查、核算、合同、招采</small></div><div class="sysbox"><b>决策主体 / 监督</b><small>授权决策、追踪、审计</small></div><div class="sysbox"><b>伙伴协同</b><small>限定项目、限定字段、限定期限</small></div></div></div><div class="arch-layer"><div class="layer-label">业务系统</div><div class="layer-body"><div class="sysbox"><b>CRM / 项目管理</b><small>XS/LX/SJ、客户、交付</small></div><div class="sysbox"><b>OA / 合同 / 招采</b><small>专业审查、决策与授权</small></div><div class="sysbox"><b>ERP / 资金</b><small>核算、应收应付、收付</small></div><div class="sysbox"><b>运营 / 档案</b><small>SLA、分润、版本证据</small></div></div></div><div class="arch-layer"><div class="layer-label">协同控制</div><div class="layer-body"><div class="sysbox"><b>状态机 + 规则版本</b><small>证据前置、职责分离、并发版本检查</small></div><div class="sysbox"><b>事件 + 对账补偿</b><small>幂等、重复消息不重复审批/入账</small></div><div class="sysbox"><b>AI 编排 + 检索</b><small>受控知识、引用、人工采纳</small></div></div></div><div class="arch-layer"><div class="layer-label">数据与底座</div><div class="layer-body"><div class="sysbox"><b>主数据 / 单据</b><small>公司、项目、客户、伙伴、合同、收付</small></div><div class="sysbox"><b>原件 / 对象存储</b><small>不可变附件、哈希、版本与来源定位</small></div><div class="sysbox"><b>身份 / 审计 / 备份</b><small>按组织和项目隔离、受控恢复</small></div></div></div><h3>跨流程接口</h3><div class="table-wrap"><table><thead><tr><th>相邻流程（参考命名）</th><th>交换对象</th><th>衔接控制</th></tr></thead><tbody><tr><td>市场需求 MTL</td><td>行业洞察、客户画像、经核实线索 → XS</td><td>市场部确认线索事实，禁止把营销接触自动认定有效商机</td></tr><tr><td>产品研发 IPD</td><td>能力目录、方案需求、产品版本与验证结果</td><td>研发确认可承诺能力，项目反馈不直接变成未审核产品承诺</td></tr><tr><td>供应链 ISC</td><td>采购需求、合格供应商、交期、成本和到货证据</td><td>综合部招采归口；采购批准、收货验收、发票与付款分别控制</td></tr><tr><td>服务问题 ITR</td><td>缺陷、投诉、SLA、质保和变更请求</td><td>运营/交付闭环；新增范围触发D4，问题关闭不等于合同关闭</td></tr><tr><td>财经 IFS</td><td>合同、履约、开票、收入成本、应收应付与收付核销</td><td>财务确定核算口径，业务提交证据；差异对账不覆盖原始记录</td></tr></tbody></table></div><p class="intro">以上是参考流程的业务接口映射，不表示公司已部署这些命名的系统或流程产品。</p><h3>实体关系主线</h3><div class="table-wrap"><table><thead><tr><th>上游</th><th>关系</th><th>下游</th><th>关键约束</th></tr></thead><tbody><tr><td>客户</td><td>1:N</td><td>线索与项目/商机</td><td>法人与付款主体分别记录；客户决策人与授权分开</td></tr><tr><td>XS线索</td><td>关联与转化</td><td>LX立项 / SJ商机</td><td>拆分合并保留来源，多对多扩展需有业务证据；不静默改原号</td></tr><tr><td>SJ项目</td><td>1:N</td><td>合同、伙伴关系、方案版本、风险</td><td>一个项目可多环节多合同，各自主体、金额、义务独立</td></tr><tr><td>合同及版本</td><td>1:N</td><td>里程碑、变更、应收、发票、采购</td><td>批准变更才更新生效基线，历史不可覆盖</td></tr><tr><td>银行实收</td><td>分笔分配/多对多</td><td>应收与合同付款节点</td><td>通过核销分配表关联；禁止重复核销、超额分配和把发票等同现金</td></tr><tr><td>决策记录</td><td>引用准确版本</td><td>提报、专业意见、条件与证据</td><td>记录授权版本、结论、范围、条件及复核，AI不能写已批准状态</td></tr></tbody></table></div><h3>系统、实体、事件与接口字典</h3>${tools('architecture')}${records(S.architecture.systems,'system')}${records(S.architecture.entities,'entity')}${records(S.architecture.relations,'relation')}${records(S.architecture.events,'event')}${records(S.architecture.apis,'api')}<h3>权限、一致性、运维与部署</h3>${value(S.architecture.security)}${value(S.architecture.reliability)}${value(S.architecture.deployment)}${refButtons(S.architecture.sourceRefs)}`,'业务事实有唯一权威来源；系统间复制通过事件、幂等与对账控制。','建议架构 · 未接入现网');}
function delivery(){return section('delivery',`<h3>按最小可验证闭环推进</h3><div class="table-wrap"><table><thead><tr><th>实施批次</th><th>具体交付</th><th>继续条件</th><th>停止或回退条件</th></tr></thead><tbody><tr><td>0.制度校准</td><td>有效版本、阈值授权表、表单口径、冲突决议、真实系统清单</td><td>综合部和决委会确认关键差异、资料权限与试点范围</td><td>无有效授权、收益阈值不明、责任边界无法确认</td></tr><tr><td>1.一个真实项目试点</td><td>XS→LX→SJ→合同→验收/收付→关闭，一套来源和编号贯通</td><td>能复核每次审核、决策和证据；上下游财务对上</td><td>补审批掩盖既成事实、重复编号、权限或对账错误</td></tr><tr><td>2.只读AI辅助</td><td>线索整理、资料缺口检查、合同差异、回款提醒草稿</td><td>人工可追溯采纳/驳回；权限、失败、引用测试通过</td><td>越权访问、无源断言、自动批准或外发</td></tr><tr><td>3.受控系统集成</td><td>OA/ERP/档案同步，幂等事件、对账、审计与恢复演练</td><td>业务负责人验收真实流程、失败恢复和回滚</td><td>重复入账、消息丢失、无法恢复或未经授权写入</td></tr></tbody></table></div><h3>指标链路：度量结果，也识别失真</h3><p>建议追踪线索转化、立项质量、投标胜率、合同质量、交付偏差、节点到期回款、逾期应收、项目现金净流入、经营偏差、伙伴目标和证据完整性。具体公式见本稿指标字典；转化率、账龄、时点、分母及排除项必须一致。</p><p class="intro">没有真实业务数据，当前不填经营指标值，不给公司成熟度打分，不套用案例DSO/IRR/奖金比例。阶段处理速度应与合规、质量、毛利及回款一起审阅，避免唯签约额。</p><h3>成熟度与变革路径 <span class="tag ref">方法参考</span></h3><div class="table-wrap"><table><thead><tr><th>等级</th><th>可观察证据（本次建议）</th><th>验收重点</th></tr></thead><tbody><tr><td>L1 初始</td><td>依赖个人，证据分散；先盘点现状，不据感觉定级</td><td>至少能找齐试点的来源、合同和收付证据</td></tr><tr><td>L2 可重复</td><td>编号、模板、角色、基本前置审批一致</td><td>同类项目能按同一规则走通</td></tr><tr><td>L3 规范</td><td>责任矩阵、授权、阶段证据与异常有统一标准</td><td>跨部门交接、原件定位和权限可验证</td></tr><tr><td>L4 量化</td><td>经营、履约和现金指标同口径，偏差有追踪闭环</td><td>指标可从明细重新计算，失败能恢复</td></tr><tr><td>L5 优化</td><td>以复盘改进规则，AI辅助效果有实测，变更受控</td><td>改善有对照，效率提升未削弱审核</td></tr></tbody></table></div><div class="note teal">变革建议：明确流程负责人 → 由跨部门试点小组共创 → 用一个真实闭环验证 → 培训岗位与伙伴 → 收集阻力和差错 → 审定改进并扩展。可借鉴Kotter/ADKAR进行沟通、能力与强化，不宣称这些方法已经在公司实施。</div><h3>后续系统与业务验收用例</h3><p class="intro">下面是待实施后的验收清单，当前未运行这些企业业务场景；本页所列用例是后续实施要求。</p>${tools('delivery')}${records(S.acceptance,'acceptance')}${refButtons(['核心包 LTC模式深度解读与治理体系 第6–8章'])}`,'先验证一个真实业务闭环，再扩展系统与AI；下列业务验收是实施要求。');}

window.addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';},{passive:true});
let savedOpen=[];
function beforePrint(){savedOpen=[...document.querySelectorAll('details')].filter(x=>x.open);document.querySelectorAll('details').forEach(x=>x.open=true);document.getElementById('activeStage').classList.add('hidden');}
function afterPrint(){document.querySelectorAll('details').forEach(x=>x.open=savedOpen.includes(x));document.getElementById('activeStage').classList.remove('hidden');}
window.addEventListener('beforeprint',beforePrint);window.addEventListener('afterprint',afterPrint);document.getElementById('printBtn').onclick=()=>window.print();
const searchDialog=document.getElementById('searchDialog'),searchInput=document.getElementById('searchInput');
document.getElementById('searchBtn').onclick=()=>{searchDialog.showModal();searchInput.focus();};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchDialog.showModal();searchInput.focus();}});
function doSearch(){const query=searchInput.value.trim(),box=document.getElementById('searchResults');if(!query){box.innerHTML='<p class="statusline">输入关键词查找正文；折叠的详细条目也会参与搜索。</p>';return;}const results=[];document.querySelectorAll('.section').forEach(sec=>{const records=[...sec.querySelectorAll('details.record')];if(records.length){records.forEach(r=>{const t=r.textContent.replace(/\s+/g,' ');const pos=t.toLowerCase().indexOf(query.toLowerCase());if(pos>=0)results.push({id:r.id,title:sec.dataset.sectionTitle+' / '+r.querySelector('summary').textContent,snippet:t.slice(Math.max(0,pos-45),pos+150)});});}const clone=sec.cloneNode(true);clone.querySelectorAll('details,.record-tools').forEach(x=>x.remove());const t=clone.textContent.replace(/\s+/g,' '),pos=t.toLowerCase().indexOf(query.toLowerCase());if(pos>=0)results.push({id:sec.id,title:sec.dataset.sectionTitle,snippet:t.slice(Math.max(0,pos-45),pos+150)});});box.innerHTML=`<p class="statusline">找到 ${results.length} 条匹配，最多显示60条</p>`+results.slice(0,60).map(x=>`<button class="search-result" data-goto="${x.id}"><b>${esc(x.title)}</b><small>${esc(x.snippet)}</small></button>`).join('');}
searchInput.addEventListener('input',doSearch);doSearch();document.getElementById('searchResults').onclick=e=>{const b=e.target.closest('[data-goto]');if(!b)return;const target=document.getElementById(b.dataset.goto);if(target.tagName==='DETAILS')target.open=true;searchDialog.close();target.scrollIntoView({block:'start'});target.setAttribute('tabindex','-1');target.focus({preventScroll:true});};</script></body></html>
